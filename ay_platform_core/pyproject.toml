# =============================================================================
# File: pyproject.toml
# Version: 16
# Path: ay_platform_core/pyproject.toml
# Description: Python project configuration for the ay_platform_core
#              sub-project of the monorepo. Targets Python 3.13.
#              Dependency versions pinned to Sept 2026 latest stable releases.
#              v16 (2026-10-06): relicensed to AGPL-3.0-or-later (was
#                   `Proprietary`). NOTE: both tier Dockerfiles already
#                   carried `org.opencontainers.image.licenses=
#                   "AGPL-3.0-or-later"` in their OCI labels, so the images
#                   had been advertising AGPL while this file said
#                   Proprietary — the two declarations now agree. Also adds
#                   `pytest-randomly` (declared, disabled by default — see
#                   the addopts comment).
#              v15 (2026-10-06): two TEST-GATE corrections, both from the
#                   test audit, both documented in place below.
#                   (a) `coverage.exclude_also` lost `"pass"` and `"\.\.\."`:
#                       the first excluded every `except …: pass` body, so
#                       the exception-swallowing branches — the riskiest
#                       construct in the codebase — were exempt from the
#                       measurement the gate is for. Cost: 15 statements
#                       re-entered accounting, immaterial at ~13k.
#                   (b) `PytestUnraisableExceptionWarning` downgraded from
#                       error to a printed warning, after tracing the
#                       offending unclosed event loop to pytest-asyncio's
#                       own loop management rather than to platform code.
#                       As an error it failed whichever test the GC
#                       happened to interrupt — a different one each run.
#              v13: platform-wide dependency refresh (2026-09-14), on explicit
#                   operator request. Every `>=x,<x+1` cap that had fallen
#                   behind its current major was opened to the current one:
#                   cryptography 44->50, argon2-cffi 23->25,
#                   kubernetes_asyncio 33->36, pypdf 5->6, tree-sitter
#                   0.25->0.26, mypy 1->2, and the deliberate starlette<1.2
#                   cap below was LIFTED by migrating the test client to
#                   httpx2 (see v12 note — the migration it was waiting on).
#                   Rationale: the caps were a written-once default, not a
#                   reviewed decision, and they silently blocked security
#                   updates rather than deferring them.
#              v12: cap `starlette<1.2`. starlette 1.2.0 (2026-05-28) made
#                   its TestClient prefer `httpx2` and emit a
#                   StarletteDeprecationWarning when only `httpx` is present;
#                   our `filterwarnings=["error"]` gate promotes that to a
#                   collection error. fastapi only requires `starlette>=0.46`,
#                   so the cap is compatible. Lift it once we migrate the
#                   test client to httpx2 deliberately.
#              v11: tree-sitter (0.25) + tree-sitter-language-pack (1.8) added
#                   as base deps for the C7 code-domain structural extractor
#                   (V2 #3-A.a / R-400-200, D-004). Existing pins keep their
#                   `>=x,<next-major` ranges — they already resolve to the
#                   latest stable WITHIN each major at install, so a rebuild
#                   picks up current stable without an untested major bump.
#              v10: `openhands` optional extra (openhands-sdk + openhands-tools)
#                   for the C4 generate-phase harness (V2 #2 / R-200-029).
#                   Installed ONLY in the C15 runner image, never in `all`.
#              v4: coverage gate enabled (80% line blocking, branch reported).
#              v5: ruff per-file-ignores extended — B008 suppressed on FastAPI
#                  router modules (Depends() in defaults is framework idiom,
#                  not the mutable-default bug B008 targets).
#              v6: mypy overrides extended — yaml/requests/docker stubs absent
#                  (third-party libs without py.typed), and check_* modules
#                  are loaded via sys.path manipulation from scripts/checks/
#                  (not an installable package).
#              v7: `system` pytest marker registered + tests/system excluded
#                  from the default pytest run (`--ignore=tests/system`).
#              v8: server-runtime deps (FastAPI, uvicorn, pyjwt[crypto],
#                  argon2-cffi, python-multipart, cryptography) promoted to
#                  main dependencies so the Dockerfile installs everything
#                  from pyproject.toml without hard-coded `pip install` calls.
#              v9: `docker>=7.1,<8.0` added to main deps — consumed by the
#                  test-tier `_observability` module (R-100-120) which
#                  ships in the same `ay-api:local` image as every other
#                  component. Test-only in scope; runtime guard at
#                  module level.
# =============================================================================

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ay_platform_core"
version = "0.1.0"
description = "AY platform - domain-agnostic backbone + pluggable production domains"
requires-python = ">=3.13"
# No README declared — the monorepo-level CLAUDE.md plays that role, and
# setuptools builds reject a dangling `readme = …` reference when the
# file is absent. Add a real README here and restore this field if one is
# authored.
# AGPL-3.0-or-later, not GPLv2 as first considered, and not by preference:
# GPLv2's copyleft triggers on DISTRIBUTION, so anyone running a modified
# AyWizz as a hosted service distributes nothing and owes nothing — the exact
# case the licence was chosen to cover. AGPLv3 §13 extends the obligation to
# users interacting with the software over a network. GPLv2 is also
# incompatible with two main dependencies (`minio` and `kubernetes_asyncio`
# are Apache-2.0, whose patent clause the FSF treats as an additional
# restriction); Apache-2.0 → AGPLv3 is explicitly compatible.
#
# PEP 639 form (an SPDX expression STRING). The older
# `license = { text = "…" }` table is rejected outright by the setuptools
# in this toolchain — `project.license must be string` — so the table form
# is not a stylistic choice here.
license = "AGPL-3.0-or-later"

dependencies = [
    # Core data & validation
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.14,<3.0",

    # HTTP server + client — every component exposes a FastAPI app; uvicorn
    # with the [standard] extra includes `watchfiles` which enables the
    # --reload behaviour that the docker-compose bind-mount relies on.
    "fastapi>=0.115,<1.0",
    # starlette is fastapi's ASGI engine (transitive). The <1.2 cap is gone:
    # 1.2.0 moved TestClient to httpx2, and `httpx2` is now a declared test
    # dependency so the deprecation no longer fires under
    # `filterwarnings=["error"]`. fastapi needs only >=0.46.
    "starlette>=1.6,<2.0",
    "uvicorn[standard]>=0.34,<1.0",
    "python-multipart>=0.0.20,<1.0",  # OAuth2 password grant + file uploads
    # httpx (1.x line) stays: it is the RUNTIME client used by every
    # component's outbound calls. httpx2 is test-tier only — see [test].
    "httpx>=0.28,<1.0",

    # Auth (C2) — JWT signing/verification + password hashing. Declared here
    # rather than in a `[server]` extra because C2 is always part of the
    # deployed topology; a deployment without C2 does not exist.
    "pyjwt[crypto]>=2.9,<3.0",
    "argon2-cffi>=25,<26",
    # cryptography backs AESGCM (crypto/secret_cipher.py) and, under
    # C2_JWT_ALGORITHM=RS256/EdDSA, the token signing key. 44->50 crosses
    # four CVEs (2026-26007 binary curves, 2026-34073 name constraints,
    # 2026-39892 non-contiguous buffers, 2026-69247 PKCS7 timing) — none of
    # which touch those two surfaces. The bump is about restoring a path to
    # future fixes, not patching a live exposure.
    "cryptography>=50,<51",

    # Storage SDKs
    # NOTE: python-arango is SYNCHRONOUS. For async components (C5, C7),
    #       the established pattern is asyncio.to_thread() per C2/C3 usage.
    "python-arango>=8.3,<9.0",
    "minio>=7.2,<8.0",

    # C7 source parsers (Phase B of v1 plan): pure-Python where possible.
    # `pypdf` is pure Python; `python-docx` pulls in lxml as a transitive
    # native dep (acceptable, install ships wheels for major platforms).
    # `beautifulsoup4` defaults to stdlib `html.parser` if lxml is absent;
    # since python-docx already brings lxml, BS4 will use it automatically.
    "pypdf>=6.0,<7.0",
    "beautifulsoup4>=4.12,<5.0",
    "python-docx>=1.1,<2.0",

    # Utilities
    "python-dotenv>=1.0,<2.0",
    "pyyaml>=6.0,<7.0",

    # Docker SDK — consumed by the test-tier `_observability` module
    # (R-100-120) to subscribe to live container log streams. Test-only
    # in spirit, but bundled in the main image because the module rides
    # on the same `ay-api:local` Dockerfile as every other component.
    "docker>=7.1,<8.0",

    # NATS client (R-200-070 / R-200-071) — at-least-once via JetStream
    # for the C4 orchestrator's hybrid-exposure event channel. Python
    # client `nats-py` covers Core NATS + JetStream from one package.
    "nats-py>=2.6,<3.0",

    # Kubernetes async client (R-200-030..033) — the C4 K8sDispatcher
    # creates ephemeral sub-agent pods in the `c4-workers` namespace and
    # watches them to completion. `kubernetes_asyncio` is the async
    # fork of the official `kubernetes` client and matches the platform's
    # FastAPI-async style. Optional in spirit (orchestrator falls back
    # to InProcessDispatcher when not installed) but bundled in the main
    # `ay-api:local` image — same shared-image rule as `R-100-114`.
    "kubernetes_asyncio>=36.0,<37.0",

    # C7 schema-guided L1 structural extraction — code domain (V2 #3-A.a /
    # R-400-200, D-004, E-400-006). `tree-sitter` is the parsing engine for
    # the code-AST extractor (MODULE/CLASS/FUNCTION/METHOD + IMPORTS /
    # INHERITS_FROM) ; `tree-sitter-language-pack` ships the pre-compiled
    # grammars (Python / TypeScript / YAML / Markdown per R-200-030) so no
    # per-grammar build step is needed. Base deps — C7 ships in the shared
    # `ay-api` image (R-100-114) and the structural extractor is core, not a
    # gated experiment.
    "tree-sitter>=0.26,<0.27",
    "tree-sitter-language-pack>=1.8,<2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "pytest-cov>=6.0,<8.0",
    "pytest-xdist>=3.8,<4.0",
    "testcontainers[arangodb,minio]>=4.14,<5.0",
    "libcst>=1.8,<2.0",
    "hypothesis>=6.155.2,<7.0",
    # starlette >= 1.2 prefers httpx2 for its TestClient and emits a
    # StarletteDeprecationWarning when only httpx 1.x is importable. Declared
    # here (test tier) rather than as a base dep: it is the TEST client that
    # moved, not the runtime client. Components keep calling out via httpx.
    "httpx2>=2.13,<3.0",
    # Test-ORDER randomisation. Declared but DISABLED BY DEFAULT via
    # `-p no:randomly` in `addopts` below — read that comment before
    # enabling it, the reasoning is there and the trade is deliberate.
    #
    # Why it is wanted: the suite had no order randomisation at all, so
    # inter-test contamination stays latent. Three intermittent failures on
    # 2026-10-06 were evidence it exists (one of them an unclosed event loop
    # leaking across tiers). Fixed order means such a defect surfaces only
    # when something unrelated changes collection order — i.e. at the worst
    # possible moment, blamed on the wrong change.
    "pytest-randomly>=4.0,<5.0",
]

dev = [
    "ruff>=0.15,<1.0",
    "mypy>=2.3,<3.0",
]

# OpenHands `generate`-phase harness (V2 #2 / R-200-029). DELIBERATELY
# NOT in `all` : this heavy extra (libtmux, tree-sitter, browser-use,
# litellm) is installed ONLY in the C15 runner image
# (infra/docker/Dockerfile.c15-runner), never in the shared `ay-api`
# image nor in the dev/CI install. The `openhands.*` import is confined
# to `pipeline/generate_engine.py` and gated behind
# `C4_GENERATE_ENGINE=openhands`. Pins reviewed monthly (R-200-030 v2).
openhands = [
    "openhands-sdk>=1.23,<2.0",
    "openhands-tools>=1.23,<2.0",
]

all = [
    "ay_platform_core[test,dev]",
]

[tool.setuptools.packages.find]
where = ["src"]

# -----------------------------------------------------------------------------
# pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
asyncio_mode = "auto"
# Coverage gate: 80% line coverage required (blocking).
# Branch coverage is measured and reported (see [tool.coverage]) but NOT
# blocking - per CLAUDE.md §11 policy (visible, not enforced, to avoid
# coverage-for-coverage-sake anti-patterns).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--cov=src",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
    # System tests require a running docker-compose stack; they are opted
    # in by invoking `pytest tests/system/` explicitly (or via the
    # dedicated run_tests.sh target). Excluded from the default run so
    # CI does not require docker.
    "--ignore=tests/system",
    # `pytest-randomly` is INSTALLED but OFF for the default gate.
    #
    # The plugin randomises collection order the moment it is importable,
    # which would make the authoritative gate's result depend on a seed. The
    # suite has known latent contamination (an event loop leaking between
    # tiers, found 2026-10-06), so turning it on by default would redden CI
    # non-deterministically and the first instinct would be to re-run rather
    # than to investigate — the habit that makes a red build mean nothing.
    #
    # So the gate stays deterministic, and randomisation becomes a tool you
    # point at the problem ON PURPOSE:
    #     python -m pytest tests/unit tests/contract -p randomly
    #     python -m pytest tests -p randomly -p no:cacheprovider
    # A failure under `-p randomly` that passes without it IS a contamination
    # bug — that is the signal this dependency exists to produce. The
    # intended home for it is a scheduled, NON-BLOCKING CI job, so the noise
    # never gates a merge.
    "-p", "no:randomly",
]
markers = [
    "unit: fast, isolated tests (no containers, no network)",
    "contract: component contract/schema tests (no containers)",
    "integration: integration tests requiring testcontainers",
    "e2e: cross-component end-to-end tests against the shared stack",
    "system: tests against a running docker-compose stack (opt-in)",
    "system_k8s: tests against a live K8s deployment (opt-in, kind cluster)",
    "coherence: spec<->code and code<->code coherence tests",
    "slow: tests taking more than 1 second",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:testcontainers.*",
    "ignore::DeprecationWarning:docker.*",
    # DOWNGRADED FROM ERROR TO A VISIBLE WARNING (2026-10-06), on evidence.
    #
    # An unraisable-exception warning fires when the garbage collector runs a
    # `__del__` that raises. `error` turned that into a test FAILURE —
    # attributed to whichever test happened to be executing when the GC
    # fired, which is nobody's fault and not reproducible. It presented as
    # `test_no_parallel_definitions` failing with
    # `ExceptionGroup: multiple unraisable exception warnings (3
    # sub-exceptions)` in a full-suite run, passing in isolation, at module
    # level, at tier level, and on re-run. Two other intermittent failures
    # the same day had the same shape.
    #
    # WHAT THE THREE SUB-EXCEPTIONS ACTUALLY ARE: one unclosed
    # `_UnixSelectorEventLoop` plus the two AF_UNIX sockets of its
    # self-pipe — a single leaked loop, not three leaks. Chased with
    # `python -X tracemalloc=15`: the allocation resolves to `import asyncio`
    # inside `pytest_asyncio/plugin.py`, i.e. the loop is created by
    # PYTEST-ASYNCIO's own loop management (auto mode, with
    # `loop_scope="session"` markers in the auth matrix alongside
    # function-scoped loops elsewhere), not by any platform code.
    #
    # So this is a test-harness artefact, not a production resource leak,
    # and promoting it to an error bought nothing while reddening builds at
    # random — which trains people to re-run CI, the habit that costs more
    # than the signal is worth. `default::` keeps it PRINTED in the warnings
    # summary of every run, so a genuine `__del__` leak introduced later is
    # still visible; it simply stops failing an unrelated test.
    #
    # Remove this entry if pytest-asyncio's loop handling is fixed upstream
    # or the mixed loop scopes are unified — the warning disappearing is the
    # signal that it can go.
    "default::pytest.PytestUnraisableExceptionWarning",
    # anyio >= 4.15 deprecated the `anyio.abc.BlockingPortal` alias, and
    # `starlette.testclient` still imports it. The warning fires at IMPORT
    # time, so `error` turned it into a COLLECTION error — every module using
    # `TestClient` failed to collect at once, which is how it presented in CI
    # on v0.1.0-beta.14 (4 errors, 1 skipped, nothing else ran).
    #
    # It is ignored rather than fixed because neither side is ours: we do not
    # import the alias anywhere, and `starlette` is capped `<1.2` ON PURPOSE
    # (see the dependency comment) pending a deliberate httpx2 test-client
    # migration. Lifting that cap is what removes this entry — not a code
    # change here.
    #
    # Matched by MESSAGE, not by module: the warning is raised from anyio but
    # attributed to whichever module triggers the import, so a `:module`
    # filter would have to enumerate every TestClient user and would silently
    # miss the next one. The message pattern stays narrow enough to keep
    # every other anyio deprecation an error.
    #
    # NB it reproduces only where anyio >= 4.15 resolves — the devcontainer
    # had 4.14.2 pinned in its image, CI installs fresh, which is why the
    # local suite was green while CI was not.
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]

# -----------------------------------------------------------------------------
# coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["src"]
branch = true
parallel = true

[tool.coverage.report]
# Lines excluded from coverage counting. These are legitimate cases where
# code is not runtime-reachable by tests (type-checking imports, abstract
# method guards, debug representations, __main__ guards, unreachable
# defensive branches). Extending this list counts as a SIGNIFICANT change
# per CLAUDE.md §11: requires user approval and written justification.
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    # `"pass"` and `"\\.\\.\\."` WERE here and are deliberately gone
    # (2026-10-06). Both matched far more than the stubs they were written
    # for, and they matched exactly the code worth watching:
    #
    #   - `pass` excluded EVERY line consisting of `pass`, which includes the
    #     body of every `except …: pass`. Exception-swallowing branches were
    #     therefore invisible to coverage accounting — and the platform has
    #     nine `contextlib.suppress(Exception)` sites (auto-KG extraction,
    #     RAG conversation-turn ingestion, backup cleanup) whose failure
    #     behaviour is the whole risk. Excluding the riskiest construct in
    #     the codebase from the measurement is the opposite of what a
    #     coverage gate is for.
    #   - `\.\.\.` matched any line CONTAINING three dots, not just an
    #     Ellipsis stub body — including strings and comments.
    #
    # Protocol / stub bodies that genuinely need the exemption should use an
    # explicit `# pragma: no cover` with a reason, per CLAUDE.md §11.2 #2,
    # so each one is a visible decision rather than a blanket regex.
    "def __repr__",
    "def __str__",
    "@(abc\\.)?abstractmethod",
]
show_missing = true
skip_covered = false
# Do not fail here - pytest's --cov-fail-under is the authoritative gate.
# This value is advisory for standalone `coverage report` invocations.
fail_under = 80
precision = 2

[tool.coverage.xml]
# Relative to this pyproject's directory (ay_platform_core/).
output = "reports/latest/coverage.xml"

[tool.coverage.html]
directory = "reports/latest/htmlcov"

# -----------------------------------------------------------------------------
# ruff
# -----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "PL",   # pylint
    "RUF",  # ruff-specific
]
ignore = [
    "PLR0913",  # too many arguments (often legitimate in factories)
    "PLR0917",  # too many positional args — same category as PLR0913, legitimate
                # on builder-style DB inserts and FastAPI endpoints (many Depends)
    "PLR2004",  # magic values (often legitimate in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]
# FastAPI routers: Depends(), Header(), Query(), Body(), File(), Form(), Path(),
# Cookie() in argument defaults are framework markers resolved per-request, not
# the mutable-default pitfall B008 targets. Silencing B008 for router modules is
# the standard FastAPI convention (see ruff FAQ).
"**/router.py" = ["B008"]
"**/*_router.py" = ["B008"]
"**/routers/*.py" = ["B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# -----------------------------------------------------------------------------
# mypy
# -----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "testcontainers.*",
    "arango.*",
    "libcst.*",
    # C1 integration/contract tests depend on these third-party libs which
    # either ship without py.typed (docker, testcontainers) or have stubs in
    # a separate package we don't want to pin (types-PyYAML, types-requests,
    # types-docker add little value for the narrow use here).
    "yaml",
    "requests",
    "requests.*",
    "docker",
    "docker.*",
    # nats-py ships without type stubs ; covered by the project-wide
    # ignore_missing_imports below but also listed explicitly so mypy's
    # error message points operators at this block when nats-py isn't
    # installed (P1.2 — R-200-070 publisher).
    "nats",
    "nats.*",
    # kubernetes_asyncio same story — async fork of the official client
    # ships without py.typed (P2.1.c — R-200-030 K8s sub-agent dispatcher).
    "kubernetes_asyncio",
    "kubernetes_asyncio.*",
    # openhands-sdk / openhands-tools — the OPTIONAL `openhands` extra
    # (V2 #2 / R-200-029). Not installed in the shared image nor in CI ;
    # imported lazily ONLY in pipeline/generate_engine.py. Ignore the
    # missing stubs so mypy passes without the heavy extra present.
    "openhands.*",
    # Coherence scripts under scripts/checks/ are standalone executables
    # loaded at test time via sys.path insertion — not an installable package.
    "check_pydantic_schemas_valid",
    "check_schema_isolation",
    "check_router_typing",
    "check_no_parallel_definitions",
    "check_canonical_imports",
    "audit_validation_reachability",
]
ignore_missing_imports = true
