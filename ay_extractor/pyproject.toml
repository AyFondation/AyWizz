# pyproject.toml — v7 (complete dependency declaration: scikit-learn for
# core.similarity, ebooklib+beautifulsoup4 for the epub extractor — these were
# imported in src but previously undeclared, so a bare editable install could
# not import/test those modules).
[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ayextractor"
version = "0.4.0"
description = "Document extraction + chunking — Phase 1+2 only (D-020 v1)"
requires-python = ">=3.11"
license = {text = "Proprietary"}

# Core runtime deps (Phase 1+2 only).
dependencies = [
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.0",
    "numpy>=2.4.2",
    # core/similarity.py (cosine / clustering helpers).
    "scikit-learn>=1.5.0",
]

[project.optional-dependencies]
# Per-format extractors (Phase 1).
pdf = [
    "pymupdf>=1.27.1",
]
docx = [
    "python-docx>=1.1.0",
]
# EPUB extractor (extraction/epub_extractor.py).
epub = [
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
]
# OpenAI-compatible LLM client only — all other provider adapters
# stripped by D-020 v1. C8 LiteLLM handles provider routing.
llm = [
    "openai>=2.21.0",
]
# Phase 2 LangGraph orchestration (decontextualizer / summarizer / densifier).
pipeline = [
    "langchain-core>=1.2.13",
    "langgraph>=1.0.8",
]
# MinIO writer (D-020 session 3 — see infra/c13_extractor/).
minio = [
    "boto3>=1.38.0",
]
# HTTP wrapper (D-020 session 4 — see infra/c13_extractor/).
http = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
]
# Reference extractor (D-020 session 3 — refextract is optional, regex fallback works without).
references = [
    "refextract>=1.1.5",
]
# Dev tooling.
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.1",
    "mypy>=1.19.1",
]
# Integration testcontainers (sessions 3-5 surface this).
integration = [
    "testcontainers>=4.14.1",
    "docker>=7.1.0",
]
# Convenience aggregate.
all = ["ayextractor[pdf,docx,epub,llm,pipeline,minio,http,references]"]

[tool.setuptools.package-dir]
ayextractor = "src"

[tool.setuptools]
# D-020 v1 strip removed: rag.*, consolidator, batch, graph.*,
# llm.adapters (other than openai).
packages = [
    "ayextractor",
    "ayextractor.api",
    "ayextractor.cache",
    "ayextractor.chunking",
    "ayextractor.config",
    "ayextractor.core",
    "ayextractor.extraction",
    "ayextractor.llm",
    "ayextractor.llm.adapters",
    "ayextractor.logging",
    "ayextractor.pipeline",
    "ayextractor.pipeline.agents",
    "ayextractor.pipeline.plugin_kit",
    "ayextractor.pipeline.prompts",
    "ayextractor.storage",
    "ayextractor.tracking",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: integration tests requiring external services",
    "slow: long-running tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
