# =============================================================================
# File: kustomization.yaml
# Version: 6
# Path: infra/k8s/overlays/dev/kustomization.yaml
# Description: Dev overlay. Wires the base manifests with the dev
#              ConfigMap (.env.config) and Secret (.env.secret) sources.
#              `kustomize build infra/k8s/overlays/dev` produces a
#              ready-to-apply manifest stream.
#
#              v2 (2026-05-26): reference each base/<component>/ EXPLICITLY
#              (like overlays/system-test) instead of `../../base`, and OMIT
#              c4_workers — it is an OPT-IN layer installed separately with
#              `infra/k8s/run.sh dev --workers`, carrying a live Pod
#              create/delete Role that should not exist unless sandboxes are
#              actually dispatched (C4_DISPATCHER_BACKEND=k8s).
#              (The original reason — its own `c4-workers` Namespace clashing
#              with the `namespace: aywizz` transformer — lapsed on
#              2026-09-08: sandboxes now run IN this namespace.)
#
#              configMapGenerator + secretGenerator hash the source
#              file contents into the ConfigMap / Secret name (e.g.
#              `aywizz-config-7c4f...`); Deployments are auto-patched
#              to reference the hashed name, so a change to .env.config
#              triggers a fresh rollout. Set `disableNameSuffixHash:
#              true` if you prefer stable names + manual rollouts.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: aywizz

# Explicit component list (NOT `../../base`), mirroring the
# overlays/system-test pattern. c4_workers + _mock_llm are intentionally
# absent: the first is the opt-in sandbox layer (`run.sh dev --workers`),
# the second is a CI-only helper.
resources:
  - ../../base/_namespace
  - ../../base/networkpolicies
  - ../../base/c11_arangodb
  - ../../base/c10_minio
  - ../../base/ollama
  - ../../base/c12_workflow
  - ../../base/ay_platform_ui
  - ../../base/c2_auth
  - ../../base/c3_conversation
  - ../../base/c4_orchestrator
  - ../../base/c5_requirements
  - ../../base/c6_validation
  - ../../base/c7_memory
  - ../../base/c8_gateway
  - ../../base/c9_mcp
  - ../../base/c16_backup      # logical per-tenant/project backup & restore (D-022)
  - ../../base/c13_extractor   # opt-in extractor (R-100-125); bucket seeded by minio-init
  - ../../base/c1_gateway
  - ../../base/_init
  # THE EDGE — the single object wiring the external URL to C1.
  - ingress.yaml

configMapGenerator:
  - name: aywizz-config
    behavior: create
    envs:
      - .env.config
    # Dev-parity with `e2e_stack.sh dev` : seed the demo tenant + 4 users on
    # C2 startup AND surface their credentials on the login page. Dev-only
    # conveniences (NOT for prod) — added as literals since
    # overlays/dev/.env.config is Tier-2 (operator-owned). §4.6 semantic
    # flags, scoped to this overlay.
    literals:
      - C2_DEMO_SEED_ENABLED=true
      - C2_UX_DEV_MODE_ENABLED=true
      # Dev-only: pre-register a local Ollama embedding provider + all-minilm
      # in the embedding registry on c8-admin startup, so a fresh dev cluster
      # has a usable embedder out of the box (the ollama-seed Job pulls the
      # model). D-011 keeps the registry EMPTY in base/prod. §4.6 semantic flag.
      - C8_SEED_OLLAMA_EMBEDDING=true
      # Dev has NO bundled Gitea → disable C4/C2 Gitea pushes (empty base_url,
      # per config: "Empty disables artifact pushes; artifacts stay in MinIO
      # only"). Without this, C4 defaults to http://gitea:3000 and every
      # live-docs write / tree read 500s on a DNS ConnectError.
      - C4_GITEA_BASE_URL=
      - C2_GITEA_BASE_URL=

secretGenerator:
  - name: aywizz-secrets
    behavior: create
    envs:
      - .env.secret
    type: Opaque

# Stable names so the Deployments' `envFrom` references survive across
# overlay rebuilds. Tradeoff: changes to .env.config / .env.secret do NOT
# auto-trigger a rollout — you must `kubectl rollout restart` the
# affected Deployments. Worth it for dev predictability.
generatorOptions:
  disableNameSuffixHash: true

# Pin the platform image to `:latest` for dev; production overlays
# should pin to a specific sha-* tag for reproducibility.
images:
  - name: ghcr.io/ayfondation/aywizz-api
    newTag: latest
  - name: ghcr.io/ayfondation/aywizz-ui
    newTag: latest

# NO Service-type patch on c1-gateway any more (v5). The edge is now the
# standard `Ingress` object in `ingress.yaml`, handled by whatever ingress
# controller the cluster runs — so `c1-gateway` stays ClusterIP in EVERY
# environment and no manifest carries a cloud-specific Service type or
# annotation. That is what makes dev and prod structurally identical and the
# whole tree portable.
#
# Dev access changed accordingly: `http://aywizz.localhost` (through the
# ingress-nginx controller on :80) instead of the former `localhost:56000`
# LoadBalancer shortcut. Install the controller once per cluster with
# `infra/k8s/run.sh dev --ingress`.
# NO resource patch either (v6). The c13-extractor CPU-request override that
# used to live here is gone: `base/` now carries request values sized for a
# small node (see the sizing policy in base/kustomization.yaml), so the dev
# overlay has nothing left to correct.
