# =============================================================================
# File: ingress.yaml
# Version: 4
# Path: infra/k8s/overlays/dev/ingress.yaml
# Description: THE EDGE — the single object wiring the external URL to the
#              platform. Everything a user reaches goes through here; nothing
#              else in the `aywizz` namespace is exposed (every other Service
#              is ClusterIP).
#
#              TWO VALUES TO CONFIGURE, and only two:
#                - `spec.ingressClassName` — the controller of THIS cluster
#                  (`nginx` when installed via `base/ingress_nginx`; on AKS
#                  application routing it is `webapprouting.kubernetes.io`,
#                  on AGIC `azure-application-gateway`).
#                - `spec.rules[0].host` — the DNS name users type.
#
#              The path routing itself (~20 rules, forward-auth, rate limits)
#              stays inside C1 Traefik as `IngressRoute` CRDs. This object
#              only says "this hostname, on this cluster, reaches C1". That
#              split is what makes the manifests portable: no cloud
#              LoadBalancer annotation and no provider-specific Service type
#              anywhere in `base/`.
#
#              TLS is not configured here — dev runs plain HTTP. Terminating
#              TLS at this edge is additive and touches NO application
#              manifest: add a `spec.tls` block to this file (see the prod
#              overlay's ingress.yaml) and provide the referenced Secret.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aywizz-edge
  labels:
    app.kubernetes.io/name: aywizz-edge
    app.kubernetes.io/component: edge
    app.kubernetes.io/part-of: aywizz-platform
  annotations:
    # C3 streams conversation tokens over SSE. nginx buffers proxied
    # responses by default, which would hold the stream until completion —
    # the UI would show nothing, then everything at once. Both settings are
    # required for streaming to survive the edge.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    # Document ingestion posts to /uploads (n8n). nginx caps request bodies
    # at 1m by default, which rejects any real document.
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  rules:
    # A REAL hostname, resolved by an operator-added /etc/hosts entry:
    #     127.0.0.1   aywizz.kube.local
    # This keeps dev behaviourally identical to prod — the edge filters on a
    # FQDN in both — instead of matching the bare `localhost`, which would
    # also collide with any other project using the host's :80.
    #
    # A `*.localhost` sub-domain is deliberately NOT used: Chrome and Firefox
    # resolve those internally, but Safari defers to the macOS resolver,
    # which maps only `localhost` itself.
    #
    # docker-desktop binds the ingress-nginx LoadBalancer on the host's :80,
    # so the platform is reachable at http://aywizz.kube.local.
    - host: aywizz.kube.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: c1-gateway
                port:
                  number: 80
