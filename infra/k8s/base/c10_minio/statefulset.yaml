# =============================================================================
# File: statefulset.yaml
# Version: 6
# Path: infra/k8s/base/c10_minio/statefulset.yaml
# Description: MinIO single-node StatefulSet (C10). v1 ships single-node;
#              distributed-mode (4+ nodes) deferred until storage scale
#              demands it.
#
#              v5 (2026-09-14): image RELEASE.2025-01-20 ->
#              RELEASE.2025-09-07, the NEWEST COMMUNITY IMAGE THAT EXISTS.
#
#              Read that literally. MinIO's security release
#              RELEASE.2025-10-15 (privilege escalation via session-policy
#              bypass on service accounts / STS) was published on GitHub as
#              source only — no container image was ever pushed for it, on
#              Docker Hub or quay.io. Pinning it fails the pull outright
#              (verified: 664 integration errors, all "No such image").
#              So this bump closes ~8 months of drift but does NOT carry
#              that CVE fix, and no image pin can. Tracked as an open
#              supply-chain item, not as a resolved vulnerability.
#
#              The console goes with it: MinIO deleted the embedded web
#              console in RELEASE.2025-05-24 ("moved to object-browser"), so
#              `--console-address :9001` and the matching containerPort no
#              longer address anything. The root credentials path is
#              unaffected; only LDAP/OIDC login went away with the console,
#              and C10 has never used either.
#
#              Default storage class is used (50 Gi). Overlays pin the
#              storageClassName explicitly for production.
# =============================================================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: c10
    app.kubernetes.io/part-of: aywizz-platform
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: minio
      app.kubernetes.io/component: c10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio
        app.kubernetes.io/component: c10
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      containers:
        - name: minio
          # A THIRD-PARTY REBUILD, chosen after both MinIO-published options
          # were ruled out on 2026-09-28. Read this before changing it back.
          #
          #   1. `quay.io/minio/minio` — the community line this platform ran
          #      until now. Still pullable at the 2025-09-07 tag, but MinIO
          #      stopped publishing images for it: RELEASE.2025-10-15 is
          #      source-only, so the line is frozen at an ageing build and its
          #      CVE fixes are unobtainable by pinning a newer tag.
          #
          #   2. `quay.io/minio/aistor/minio` — the AIStor line. Pulls and
          #      starts, then denies EVERY S3 operation:
          #        AccessDenied — "No license is installed. Please install a
          #        valid license using 'mc license update' to enable service."
          #      It failed on the integration tier's first `list_buckets`.
          #      Whatever the capacity terms, a licence is a PREREQUISITE,
          #      not an optional extra — revisit only once one exists and can
          #      be mounted into this pod.
          #
          # SILO is Pigsty's FORK of MinIO — not a rebuild of it, which is a
          # sharper distinction than it sounds: a rebuild tracks upstream, a
          # fork diverges. It serves S3 with no licence gate, verified on the
          # real credentials + policy path and across the storage-heavy
          # integration tiers (C7 artifacts, C16 snapshot/restore), and the
          # `mc` admin surface this platform's init Job depends on still
          # answers it.
          #
          # PINNED BY DIGEST, not by tag. Silo publishes no versioned tag at
          # the time of writing — only `latest`, which this repository's own
          # discipline forbids ("bump deliberately, never float"). The digest
          # keeps the tag readable while making the reference immutable, so a
          # silent upstream re-push cannot change what runs here. Replace
          # with a real tag the moment one is published.
          #
          # THE TRADE-OFF IS PROVENANCE, and it is worth stating plainly:
          # this is a third-party fork of the component that holds ALL of the
          # platform's objects. Its update cadence, and its response to a
          # CVE, are the Pigsty project's — not MinIO's. Watch it as such.
          image: pgsty/silo:latest@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
          imagePullPolicy: IfNotPresent
          args:
            - "server"
            - "/data"
          ports:
            - name: s3
              containerPort: 9000
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              # Non-secret admin username (the `minioadmin` default + the
              # compose convention in .env.test). Literal on purpose : it is
              # NOT sensitive and the operator .env.secret never declared it
              # (only the password is). minio-init connects with the same
              # value via the configmap. Override per-env in an overlay patch.
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aywizz-secrets
                  key: MINIO_ROOT_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          # CPU ABOVE the 200m platform default, like arangodb and litellm:
          # MinIO does work, it does not route. Startup verifies the disk
          # format and initialises erasure sets, and every object write is
          # checksummed. At 200m (2026-09-17) it accepted TCP connections and
          # then closed them without responding — `mc alias set` failed for
          # 280s straight, minio-init never created the application user, and
          # nine pods waited on credentials that were never going to exist.
          # Its readiness probe passed throughout, because /minio/health/ready
          # is cheap: healthy in ArgoCD, unable to serve.
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "25m"
              memory: "128Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi
