# =============================================================================
# File: service.yaml
# Version: 3
# Path: infra/k8s/base/c10_minio/service.yaml
# Description: Headless Service for the MinIO StatefulSet. S3 port only.
#
#              v3 (2026-09-14): console port 9001 removed. MinIO deleted the
#              embedded console in RELEASE.2025-05-24; the StatefulSet no
#              longer opens that containerPort, so a Service port targeting
#              it would resolve to nothing. See statefulset.yaml v5.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: minio
  labels:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: c10
    app.kubernetes.io/part-of: aywizz-platform
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: minio
    app.kubernetes.io/component: c10
  ports:
    - name: s3
      port: 9000
      targetPort: s3
      protocol: TCP
