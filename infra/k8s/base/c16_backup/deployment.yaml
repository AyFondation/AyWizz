# =============================================================================
# File: deployment.yaml
# Version: 3
# Path: infra/k8s/base/c16_backup/deployment.yaml
# Description: C16 Backup/Restore Deployment (D-022 / 900-SPEC). Shared
#              `aywizz-api` image, runtime selected via
#              `COMPONENT_MODULE=c16_backup`. Behind C1 forward-auth. Reads the
#              shared ArangoDB + MinIO by DataMap and writes archives to the
#              dedicated `backups` bucket (R-900-004). Arango/MinIO credentials
#              come from aywizz-config + aywizz-secrets via envFrom.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c16-backup
  labels:
    app.kubernetes.io/name: c16-backup
    app.kubernetes.io/component: c16
    app.kubernetes.io/part-of: aywizz-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c16-backup
      app.kubernetes.io/component: c16
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c16-backup
        app.kubernetes.io/component: c16
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      containers:
        - name: api
          image: ghcr.io/ayfondation/aywizz-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: COMPONENT_MODULE
              value: c16_backup
            - name: PYTHONUNBUFFERED
              value: "1"
            # MinIO — the archive store. Credentials come from aywizz-secrets
            # via envFrom; the endpoint + the dedicated backups bucket are set
            # here (R-900-004).
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_SECURE
              value: "false"
            - name: C16_BACKUPS_BUCKET
              value: backups
          envFrom:
            - configMapRef:
                name: aywizz-config
            - secretRef:
                name: aywizz-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "25m"
              memory: "96Mi"
