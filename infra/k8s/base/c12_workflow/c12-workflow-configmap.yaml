# =============================================================================
# File: c12-workflow-configmap.yaml
# Path: infra/k8s/base/c12_workflow/c12-workflow-configmap.yaml
# Description: GENERATED — do not edit by hand. The `c12-workflow-files`
#              ConfigMap holds every n8n workflow JSON (single source:
#              infra/c12_workflow/workflows/). Mounted at /workflows by the
#              c12-workflow Deployment and imported by the c12-workflow-seed
#              Job. Regenerate with:
#                python3 infra/c12_workflow/scripts/gen_k8s_workflow_configmap.py
# =============================================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: c12-workflow-files
  labels:
    app.kubernetes.io/name: c12-workflow-files
    app.kubernetes.io/component: c12
    app.kubernetes.io/part-of: aywizz-platform
data:
  extract_and_ingest.json: |-
    {
      "_comment": "Version: 3 | Path: infra/c12_workflow/workflows/extract_and_ingest.json | Description: D-020 R-100-081 v3 ingestion workflow — METADATA-ONLY orchestration. C7 now owns byte custody: it writes the raw upload to MinIO and POSTs THIS webhook with metadata only (raw_object_key + ids, NO bytes). C12 (n8n) therefore never touches object bytes: webhook(metadata) -> C13 POST /analyze -> poll GET /status -> C7 POST /ingest-chunks (run reference only; C7 reads chunks.jsonl + run_manifest.json from MinIO itself, R-400-223 v3) -> respond. v3 removed the base64-decode, MinIO PUT, and MinIO GET nodes of v2 (n8n cannot SigV4-sign S3 and is a poor binary custodian). Import via `docker compose exec c12 n8n import:workflow --input=/workflows/extract_and_ingest.json`. @relation implements:R-100-080 R-100-081 R-100-125 R-400-223",
      "id": "extract-and-ingest-v1",
      "name": "Extract & Ingest (C7 -> C12 -> C13 -> C7)",
      "nodes": [
        {
          "parameters": {
            "httpMethod": "POST",
            "path": "extract-and-ingest",
            "responseMode": "onReceived",
            "options": { "rawBody": false }
          },
          "id": "webhook-extract-ingest",
          "name": "Webhook — POST /uploads/extract-and-ingest",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [200, 360],
          "webhookId": "extract-and-ingest-v1",
          "notes": "Triggered by C7 after it stores the raw bytes (R-100-081 v3). Body is metadata only: tenant_id, project_id, source_id, raw_object_key, filename, mime_type, format, quality_tier?, document_type?, uploaded_by."
        },
        {
          "parameters": {
            "method": "POST",
            "url": "http://c13-extractor:8000/analyze",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                { "name": "Content-Type", "value": "application/json" }
              ]
            },
            "sendBody": true,
            "specifyBody": "json",
            "jsonBody": "={\n  \"tenant_id\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.tenant_id}}\",\n  \"project_id\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.project_id}}\",\n  \"source_id\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.source_id}}\",\n  \"raw_object_key\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.raw_object_key}}\",\n  \"filename\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.filename}}\",\n  \"mime_type\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.mime_type || 'application/octet-stream'}}\",\n  \"format\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.format}}\",\n  \"quality_tier\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.quality_tier || 'minimal'}}\",\n  \"urgency\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.urgency || 'interactive'}}\",\n  \"document_type\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.document_type || 'report'}}\",\n  \"config_overrides\": {{JSON.stringify($('Webhook — POST /uploads/extract-and-ingest').item.json.body.config_overrides || null)}},\n  \"language\": null\n}",
            "options": {
              "response": { "response": { "fullResponse": false } },
              "timeout": 30000
            }
          },
          "id": "c13-analyze",
          "name": "C13 POST /analyze",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [460, 360],
          "notes": "C7 already wrote the raw object; C13 reads it from `raw_object_key` (in C13's own bucket). C13 acks with {run_id} and processes asynchronously."
        },
        {
          "parameters": { "amount": 5, "unit": "seconds" },
          "id": "wait-poll",
          "name": "Wait 5s (poll interval)",
          "type": "n8n-nodes-base.wait",
          "typeVersion": 1.1,
          "position": [700, 360]
        },
        {
          "parameters": {
            "method": "GET",
            "url": "=http://c13-extractor:8000/status/{{$('C13 POST /analyze').item.json.run_id}}?tenant_id={{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.tenant_id}}&project_id={{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.project_id}}&source_id={{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.source_id}}",
            "sendHeaders": false,
            "options": { "timeout": 10000 }
          },
          "id": "c13-status-poll",
          "name": "C13 GET /status/{run_id}",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [940, 360]
        },
        {
          "parameters": {
            "conditions": {
              "options": { "caseSensitive": true, "typeValidation": "loose" },
              "conditions": [
                {
                  "id": "status-terminal",
                  "leftValue": "={{$json.status}}",
                  "rightValue": "running",
                  "operator": { "type": "string", "operation": "notEquals" }
                }
              ],
              "combinator": "and"
            },
            "options": {}
          },
          "id": "if-terminal",
          "name": "IF status terminal",
          "type": "n8n-nodes-base.if",
          "typeVersion": 2,
          "position": [1180, 360]
        },
        {
          "parameters": {
            "conditions": {
              "options": { "caseSensitive": true, "typeValidation": "loose" },
              "conditions": [
                {
                  "id": "status-completed",
                  "leftValue": "={{$json.status}}",
                  "rightValue": "completed",
                  "operator": { "type": "string", "operation": "equals" }
                }
              ],
              "combinator": "and"
            },
            "options": {}
          },
          "id": "if-completed",
          "name": "IF status completed",
          "type": "n8n-nodes-base.if",
          "typeVersion": 2,
          "position": [1420, 240]
        },
        {
          "parameters": {
            "method": "POST",
            "url": "=http://c7:8000/api/v1/memory/projects/{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.project_id}}/sources/{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.source_id}}/ingest-chunks",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                { "name": "X-User-Id", "value": "={{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.uploaded_by || 'system'}}" },
                { "name": "X-Tenant-Id", "value": "={{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.tenant_id}}" },
                { "name": "X-User-Roles", "value": "project_editor,project_owner,admin" },
                { "name": "Content-Type", "value": "application/json" }
              ]
            },
            "sendBody": true,
            "specifyBody": "json",
            "jsonBody": "={\n  \"extraction_run_id\": \"{{$('C13 POST /analyze').item.json.run_id}}\",\n  \"uploaded_by\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.uploaded_by || 'system'}}\",\n  \"mime_type\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.mime_type || 'application/octet-stream'}}\",\n  \"tenant_id\": \"{{$('Webhook — POST /uploads/extract-and-ingest').item.json.body.tenant_id}}\"\n}",
            "options": { "timeout": 60000 }
          },
          "id": "c7-ingest-chunks",
          "name": "C7 POST /ingest-chunks",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [1660, 240],
          "notes": "R-400-223 v3: run reference only. C7 reads chunks.jsonl + run_manifest.json from MinIO itself — n8n never touches object bytes. The webhook already responded (onReceived); this runs async, so no respond node is needed."
        }
      ],
      "connections": {
        "Webhook — POST /uploads/extract-and-ingest": {
          "main": [[{ "node": "C13 POST /analyze", "type": "main", "index": 0 }]]
        },
        "C13 POST /analyze": {
          "main": [[{ "node": "Wait 5s (poll interval)", "type": "main", "index": 0 }]]
        },
        "Wait 5s (poll interval)": {
          "main": [[{ "node": "C13 GET /status/{run_id}", "type": "main", "index": 0 }]]
        },
        "C13 GET /status/{run_id}": {
          "main": [[{ "node": "IF status terminal", "type": "main", "index": 0 }]]
        },
        "IF status terminal": {
          "main": [
            [{ "node": "IF status completed", "type": "main", "index": 0 }],
            [{ "node": "Wait 5s (poll interval)", "type": "main", "index": 0 }]
          ]
        },
        "IF status completed": {
          "main": [
            [{ "node": "C7 POST /ingest-chunks", "type": "main", "index": 0 }],
            []
          ]
        }
      },
      "settings": {
        "executionOrder": "v1",
        "saveDataSuccessExecution": "all",
        "saveExecutionProgress": true
      },
      "active": true,
      "staticData": null,
      "pinData": {}
    }
  reembed_project.json: |-
    {
      "_comment": "Version: 1 | Path: infra/c12_workflow/workflows/reembed_project.json | Description: D-011 R-400-229 re-embed trigger workflow. c8_admin POSTs this webhook with {job:'reembed', tenant_id, project_id, model_id} when a registry embedding model is edited (vectors change) or a project switches selection. n8n then calls C7 POST /projects/{project_id}/reembed AS THE SYSTEM (self-asserted project_owner headers, same convention as extract_and_ingest) — reembed is a CONTENT op and the triggering operator may be a content-blind platform_manager, so the recompute runs decoupled as the system, never under the operator identity. Re-embed ONLY (C7 recomputes vectors from the already-stored chunk text; no re-parse/chunk/LLM). onReceived → acks immediately, C7 reembed runs async. Import via `docker compose exec c12 n8n import:workflow --input=/workflows/reembed_project.json`. @relation implements:R-400-229",
      "id": "reembed-project-v1",
      "name": "Re-embed Project (c8_admin -> C12 -> C7)",
      "nodes": [
        {
          "parameters": {
            "httpMethod": "POST",
            "path": "reembed-project",
            "responseMode": "onReceived",
            "options": { "rawBody": false }
          },
          "id": "webhook-reembed-project",
          "name": "Webhook — POST /uploads/reembed-project",
          "type": "n8n-nodes-base.webhook",
          "typeVersion": 2,
          "position": [200, 360],
          "webhookId": "reembed-project-v1",
          "notes": "Triggered by c8_admin (D-011 R-400-222). Body: { job: 'reembed', tenant_id, project_id, model_id }. Fire-and-forget best-effort — a failure is logged c8_admin-side and never blocks the admin op."
        },
        {
          "parameters": {
            "method": "POST",
            "url": "=http://c7:8000/api/v1/memory/projects/{{$('Webhook — POST /uploads/reembed-project').item.json.body.project_id}}/reembed",
            "sendHeaders": true,
            "headerParameters": {
              "parameters": [
                { "name": "X-User-Id", "value": "system" },
                { "name": "X-Tenant-Id", "value": "={{$('Webhook — POST /uploads/reembed-project').item.json.body.tenant_id}}" },
                { "name": "X-User-Roles", "value": "project_owner,admin" },
                { "name": "Content-Type", "value": "application/json" }
              ]
            },
            "sendBody": false,
            "options": { "timeout": 600000 }
          },
          "id": "c7-reembed",
          "name": "C7 POST /reembed",
          "type": "n8n-nodes-base.httpRequest",
          "typeVersion": 4.2,
          "position": [460, 360],
          "notes": "System-authed reembed (self-asserted project_owner; NOT platform_manager, which is content-excluded). C7 recomputes vectors in place from stored chunk text — re-embed only. Long timeout: a large project re-embeds many chunks. The webhook already responded (onReceived); this runs async, so no respond node is needed."
        }
      ],
      "connections": {
        "Webhook — POST /uploads/reembed-project": {
          "main": [[{ "node": "C7 POST /reembed", "type": "main", "index": 0 }]]
        }
      },
      "settings": {
        "executionOrder": "v1",
        "saveDataSuccessExecution": "all",
        "saveExecutionProgress": true
      },
      "active": true,
      "staticData": null,
      "pinData": {}
    }
