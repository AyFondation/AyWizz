# =============================================================================
# File: deployment.yaml
# Version: 8
# Path: infra/k8s/base/c12_workflow/deployment.yaml
# Description: C12 Workflow Engine (n8n) Deployment. Off-the-shelf
#              `n8nio/n8n:2.38.7` image. SQLite DB on PVC.
#
#              v2 (2026-08-24): workflows are imported + activated by an
#              `import-workflows` initContainer that runs BEFORE the n8n
#              server starts, so n8n always BOOTS with every active
#              workflow's webhook registered. This removes the race the
#              standalone c12-workflow-seed Job had — the Job imports into
#              the shared PVC while the server is ALREADY running, so a
#              NEWLY-added workflow's webhook only became live on a SECOND
#              restart. The init runs on every (re)start, is idempotent,
#              and reads the same `c12-workflow-files` ConfigMap. The seed
#              Job in `_init/` is now a redundant safety net.
#
#              Public webhook endpoints under `/uploads/*` (per
#              R-100-080..088); routed to this service by C1 Traefik
#              IngressRoute.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c12-workflow
  labels:
    app.kubernetes.io/name: c12-workflow
    app.kubernetes.io/component: c12
    app.kubernetes.io/part-of: aywizz-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: c12-workflow
      app.kubernetes.io/component: c12
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c12-workflow
        app.kubernetes.io/component: c12
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      # THE PVC IS MOUNTED ROOT-OWNED, AND n8n RUNS AS UID 1000. The image
      # declares `USER node` (uid/gid 1000), but a freshly provisioned volume
      # arrives owned by root:root, so n8n's first write to
      # `/home/node/.n8n/config` — the auto-generated encryption key, written
      # before anything else — fails with
      # `EACCES: permission denied, open '/home/node/.n8n/config'`, and
      # `import:workflow` never loads. Observed on AKS 2026-09-18.
      #
      # WHY IT WORKED LOCALLY AND NOT ON AKS: Docker Desktop backs PVCs with a
      # permissive hostpath, which hides the ownership entirely. The Azure Disk
      # CSI driver does not — this class of bug cannot surface before the first
      # real cluster.
      #
      # `fsGroup` makes the kubelet set the volume's group to 1000 and add
      # group-write, which is the supported way to hand a volume to a non-root
      # container. `OnRootMismatch` restricts the (recursive) ownership pass to
      # the case where the volume root is actually wrong, so a restart does not
      # walk a grown volume for nothing.
      #
      # `runAsUser` / `runAsGroup` pin what the image already does. They are
      # not the fix — `fsGroup` is — but they make the UID that must match
      # `fsGroup` explicit here rather than implicit in an upstream base image
      # that could change it.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        # Import + activate all workflows INTO the PVC before n8n starts, so
        # the server boots with every webhook registered (no seed-Job race).
        # Idempotent; runs on every (re)start. `n8n import` runs the SQLite
        # migrations itself, so it works on a fresh PVC too.
        - name: import-workflows
          image: n8nio/n8n:2.38.7
          imagePullPolicy: IfNotPresent
          # An initContainer needs its own limits: a namespace ResourceQuota
          # rejects the POD, so one undeclared initContainer blocks the whole
          # Deployment — which is how c12 joined the nine stuck pods on AKS
          # (2026-09-17) even though its main container was fully sized.
          # Same envelope as the seed Job: this runs the identical n8n boot +
          # SQLite migration chain.
          resources:
            requests:
              cpu: "25m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "1024Mi"
          env:
            - name: DB_TYPE
              value: "sqlite"
            - name: DB_SQLITE_DATABASE
              value: "/home/node/.n8n/database.sqlite"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # This initContainer gates the whole c12 pod. It depends on
              # NOTHING external — only the PVC and the /workflows ConfigMap —
              # so if c12 hangs here the cause is local, not a missing
              # dependency. Saying so up front saves looking for one.
              echo "[c12-init] db       : ${DB_SQLITE_DATABASE}"
              echo "[c12-init] source   : /workflows (ConfigMap, versioned)"
              echo "[c12-init] no external dependency — PVC + ConfigMap only"
              echo "[c12-init] workflows found:"
              ls -1 /workflows 2>/dev/null || echo "  (none)"
              if [ -d /workflows ] && [ -n "$(ls -A /workflows 2>/dev/null)" ]; then
                # GitOps model: the workflow DB is FULLY derived from
                # /workflows (the versioned source of truth). n8n has no delete
                # CLI and its sqlite driver path is version-specific, so the
                # robust, dependency-free way to guarantee the DB matches the
                # repo — and that orphans (e.g. a workflow that once got a random
                # n8n id from an import of a file with no stable `id`) cannot
                # linger — is to RESET the sqlite file, then let import recreate
                # the schema + the current set. n8n stores no credentials here
                # (C7/C13 auth is header-based) and execution history is
                # ephemeral, so the reset is safe.
                echo "[c12-init] resetting the sqlite DB (fully derived from /workflows)"
                rm -f "${DB_SQLITE_DATABASE}" "${DB_SQLITE_DATABASE}"-shm \
                      "${DB_SQLITE_DATABASE}"-wal 2>/dev/null || true
                echo "[c12-init] importing (this boots n8n and runs the SQLite migrations)"
                n8n import:workflow --separate --input=/workflows
                # See _init/c12-workflow-seed.yaml: n8n 2.x removed
                # `update:workflow --all --active=true` and `import:workflow`
                # deactivates what it imports, so publishing is per id now.
                # No `|| true` here either — a pod whose webhooks are not
                # registered must NOT report itself ready.
                echo "[c12-init] publishing each workflow by id (n8n 2.x: import deactivates)"
                for wf in /workflows/*.json; do
                  wf_id="$(node -p "require('${wf}').id")"
                  echo "  publishing ${wf_id}"
                  n8n publish:workflow --id="${wf_id}"
                done
              else
                echo "[c12-init] nothing to import — /workflows is absent or empty"
              fi
              echo "[c12-init] DONE — n8n may start with every webhook registered"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: workflows
              mountPath: /workflows
              readOnly: true
      containers:
        - name: n8n
          image: n8nio/n8n:2.38.7
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5678
              protocol: TCP
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_ENDPOINT_WEBHOOK
              value: "uploads"
            - name: N8N_ENDPOINT_WEBHOOK_TEST
              value: "uploads-test"
            - name: N8N_SECURE_COOKIE
              value: "false"
            - name: N8N_RUNNERS_ENABLED
              value: "true"
            - name: DB_TYPE
              value: "sqlite"
            - name: DB_SQLITE_DATABASE
              value: "/home/node/.n8n/database.sqlite"
            - name: N8N_DIAGNOSTICS_ENABLED
              value: "false"
            - name: N8N_VERSION_NOTIFICATIONS_ENABLED
              value: "false"
            - name: N8N_PERSONALIZATION_ENABLED
              value: "false"
            - name: WEBHOOK_URL
              valueFrom:
                configMapKeyRef:
                  name: aywizz-config
                  key: PUBLIC_BASE_URL
                  optional: true
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: workflows
              mountPath: /workflows
              readOnly: true
          # First boot runs SQLite migrations (60-90s); start_period
          # mirrors compose v6.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 90
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "200m"
              memory: "1024Mi"
            requests:
              cpu: "25m"
              memory: "256Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: c12-data
        - name: workflows
          configMap:
            # Workflows shipped as a ConfigMap rather than baked into
            # the image — same source files (`infra/c12_workflow/
            # workflows/`) consumed by both compose and K8s. The
            # ConfigMap is generated by Kustomize from the overlay's
            # configMapGenerator (see overlays/dev/kustomization.yaml).
            name: c12-workflow-files
            optional: true
