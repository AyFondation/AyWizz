# =============================================================================
# File: serviceaccount.yaml
# Version: 4
# Path: infra/k8s/base/c1_gateway/serviceaccount.yaml
# Description: Identity the C1 Traefik Deployment runs as. Holds NO
#              permissions, and its token is not even mounted.
#
#              v4 (2026-09-08): REMOVED the ClusterRole + ClusterRoleBinding.
#              Traefik now uses the FILE provider (deployment.yaml v4) and
#              makes no Kubernetes API call at all, so it needs no rights —
#              not a smaller Role, none. Backends are reached by Service DNS.
#              `automountServiceAccountToken: false` follows the same
#              defense-in-depth pattern as `c4_workers/serviceaccount.yaml`:
#              no permissions AND no token in the pod.
#
#              WHY THIS MATTERS: the removed ClusterRole granted cluster-wide
#              `list/watch` on `secrets` — every Secret of every namespace,
#              including `aywizz-secrets` (provider API keys,
#              AY_SECRET_MASTER_KEY) — to the single most exposed component
#              of the platform, the one that terminates external traffic.
#
#              It could NOT simply be narrowed to a namespaced Role: the CRD
#              provider's shared informer watches `nodes`, a cluster-scoped
#              resource that no Role can ever grant. Verified experimentally
#              on 2026-09-07 — revoking `nodes` and cold-restarting Traefik
#              dropped the router table to zero (all 404). Dropping the CRD
#              provider was therefore the only route to a namespace-only
#              permission model.
#
#              The platform now declares ZERO cluster-scoped RBAC.
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: traefik
  labels:
    app.kubernetes.io/name: c1-gateway
    app.kubernetes.io/component: c1
    app.kubernetes.io/part-of: aywizz-platform
automountServiceAccountToken: false
