# =============================================================================
# File: ingressroutes.yaml
# Version: 8
# Path: infra/k8s/base/c1_gateway/ingressroutes.yaml
# Description: Traefik IngressRoute CRDs — K8s mirror of
#              `infra/c1_gateway/dynamic/routers.yml` (v10). Same path
#              prefixes/regexps, same priorities, same middlewares, same
#              backend services as the compose dev stack (resolved through
#              K8s DNS rather than Docker DNS).
#
#              v5 (2026-08-31): add the c8-admin API route /admin/v1/storage
#              (priority 100) that was omitted — storage metering + snapshot
#              trigger fell through to /admin→c2 → 404.
#              v4 (2026-08-26): add the UI governance PAGE route
#              /admin/embedding (priority 60 → ay-platform-ui, no forward-auth;
#              compose router `ui-admin-embedding`) that v3 omitted. Without it,
#              opening the embedding registry/providers/catalogue pages fell
#              through to /admin→c2 [forward-auth] → {"detail":"Not
#              authenticated"}. The embedding ADMIN API stays on
#              /admin/v1/llm/embedding-* (priority 100), unaffected.
#
#              v3 (2026-07-27): add the 4 c8-admin API routes (LLM registry /
#              catalogue / quota) that the v2 mirror omitted — /admin/v1/llm
#              + /admin/v1/quota (priority 100, beat /admin→c2), /api/v1/llm
#              + /api/v1/quota (priority 50) — PLUS the UI governance PAGE
#              route /admin/llm (priority 60 → ay-platform-ui, no forward-auth;
#              compose router `ui-admin-llm`). Without the PAGE route a hard
#              refresh on /admin/llm-providers hit /admin→c2 → 401.
#
#              v2 (2026-05-27): full re-sync with routers.yml v7. The v1
#              mirror routed ALL `/api/v1/projects/*` to C5 — WRONG. The
#              `/api/v1/projects` space is split by subpath/priority :
#                - .../artifacts|git|documents  → C4  (priority 100)
#                - /api/v1/admin/projects        → C4  (priority 100)
#                - .../requirements/*            → C5  (priority 100)
#                - generic /api/v1/projects      → C2  (priority 50)
#              Also adds the missing C2 /admin and C2 preferences routes.
#
#              Public routes:
#                /auth/login (POST)              → c2 [rate-limit-auth]
#                /auth/token (POST)              → c2 [rate-limit-auth]
#                /auth/*                         → c2
#                /ux/*                           → c2
#                /api/v1/conversations/*         → c3 [forward-auth-c2, secure-headers]
#                /api/v1/orchestrator/*          → c4 [forward-auth-c2, secure-headers]
#                /api/v1/projects/*/artifacts    → c4 [forward-auth-c2, secure-headers]
#                /api/v1/projects/*/git          → c4 [forward-auth-c2, secure-headers]
#                /api/v1/projects/*/documents    → c4 [forward-auth-c2, secure-headers]
#                /api/v1/admin/projects/*        → c4 [forward-auth-c2, secure-headers]
#                /admin/*                        → c2 [forward-auth-c2, secure-headers]
#                /api/v1/projects/*/requirements → c5 [forward-auth-c2, secure-headers]
#                /api/v1/projects/*              → c2 [forward-auth-c2, secure-headers]
#                /api/v1/users/me/preferences    → c2 [forward-auth-c2, secure-headers]
#                /api/v1/validation/*            → c6 [forward-auth-c2, secure-headers]
#                /api/v1/memory/*                → c7 [forward-auth-c2, secure-headers]
#                /api/v1/mcp(/*)?                → c9 [forward-auth-c2, secure-headers]
#                /uploads/*                      → c12 [forward-auth-c2, secure-headers]
#                /                               → ui (catch-all, priority 1)
# =============================================================================
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: aywizz-public
  labels:
    app.kubernetes.io/name: c1-gateway
    app.kubernetes.io/component: c1
    app.kubernetes.io/part-of: aywizz-platform
spec:
  entryPoints:
    - web
  routes:
    # ---- C2 Auth (public, rate-limited login/token) ----
    - match: Path(`/auth/login`) && Method(`POST`)
      kind: Rule
      priority: 100
      services:
        - name: c2-auth
          port: 8000
      middlewares:
        - name: rate-limit-auth
    - match: Path(`/auth/token`) && Method(`POST`)
      kind: Rule
      priority: 100
      services:
        - name: c2-auth
          port: 8000
      middlewares:
        - name: rate-limit-auth
    - match: PathPrefix(`/auth`)
      kind: Rule
      priority: 10
      services:
        - name: c2-auth
          port: 8000
    - match: PathPrefix(`/ux`)
      kind: Rule
      priority: 10
      services:
        - name: c2-auth
          port: 8000
    # ---- C3 Conversation ----
    - match: PathPrefix(`/api/v1/conversations`)
      kind: Rule
      priority: 50
      services:
        - name: c3-conversation
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C4 Orchestrator ----
    - match: PathPrefix(`/api/v1/orchestrator`)
      kind: Rule
      priority: 50
      services:
        - name: c4-orchestrator
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # C4 project subpaths (priority 100 — win over the generic c2-projects)
    - match: PathRegexp(`^/api/v1/projects/[^/]+/artifacts(/.*)?$`)
      kind: Rule
      priority: 100
      services:
        - name: c4-orchestrator
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    - match: PathRegexp(`^/api/v1/projects/[^/]+/git(/.*)?$`)
      kind: Rule
      priority: 100
      services:
        - name: c4-orchestrator
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    - match: PathRegexp(`^/api/v1/projects/[^/]+/documents(/.*)?$`)
      kind: Rule
      priority: 100
      services:
        - name: c4-orchestrator
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    - match: PathPrefix(`/api/v1/admin/projects`)
      kind: Rule
      priority: 100
      services:
        - name: c4-orchestrator
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C8 Admin (LLM governance HMI: registry / catalogue / quota) ----
    # `/admin/v1/llm` + `/admin/v1/quota` MUST win over the generic
    # `/admin` → c2 route (priority 50) → priority 100. `/api/v1/llm` +
    # `/api/v1/quota` are distinct strings (priority 50). Mirrors the compose
    # Traefik routers c8-admin-{registry,catalog,quota,quota-self}.
    - match: PathPrefix(`/admin/v1/llm`)
      kind: Rule
      priority: 100
      services:
        - name: c8-admin
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    - match: PathPrefix(`/admin/v1/quota`)
      kind: Rule
      priority: 100
      services:
        - name: c8-admin
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # C8 admin storage metering (E-100-002 v7) — per-project/tenant disk usage
    # + the snapshot trigger. Same c8-admin backend as llm/quota; priority 100
    # beats the generic /admin→c2. Without it, POST /admin/v1/storage/snapshot
    # falls through to c2 → 404.
    - match: PathPrefix(`/admin/v1/storage`)
      kind: Rule
      priority: 100
      services:
        - name: c8-admin
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    - match: PathPrefix(`/api/v1/llm`)
      kind: Rule
      priority: 50
      services:
        - name: c8-admin
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    - match: PathPrefix(`/api/v1/quota`)
      kind: Rule
      priority: 50
      services:
        - name: c8-admin
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- UI governance PAGE paths (Next.js `/admin/llm-*`) ----
    # `/admin/llm-providers` + `/admin/llm-registry` + `/admin/llm-catalogue`
    # are UI pages that collide with the C2 `/admin` API prefix. Priority 60
    # (> 50 c2, < 100 the `/admin/v1/llm` API) sends the PAGE document to the
    # UI. NO forward-auth: the browser fetches the page; the UI's apiClient
    # carries the JWT on the API calls. Mirrors compose router `ui-admin-llm`.
    - match: PathPrefix(`/admin/llm`)
      kind: Rule
      priority: 60
      services:
        - name: ay-platform-ui
          port: 3000
    # ---- UI governance PAGE paths (Next.js `/admin/embedding-*`) ----
    # `/admin/embedding-registry` + `/admin/embedding-providers` +
    # `/admin/embedding-catalogue` are UI pages that collide with the C2
    # `/admin` API prefix. Same treatment as `/admin/llm`: priority 60
    # (> 50 c2, < 100 the `/admin/v1/llm` embedding API) sends the PAGE to the
    # UI, NO forward-auth. Without this, page nav falls through to `/admin` →
    # c2 [forward-auth] and returns "Not authenticated".
    - match: PathPrefix(`/admin/embedding`)
      kind: Rule
      priority: 60
      services:
        - name: ay-platform-ui
          port: 3000
    # ---- C2 Admin (tenants lifecycle) ----
    - match: PathPrefix(`/admin`)
      kind: Rule
      priority: 50
      services:
        - name: c2-auth
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C5 Requirements (only the /requirements subpath, priority 100) ----
    - match: PathRegexp(`^/api/v1/projects/[^/]+/requirements(/.*)?$`)
      kind: Rule
      priority: 100
      services:
        - name: c5-requirements
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C16 Backup/Restore — the /backups subpath, priority 100 (beats the
    #      generic /api/v1/projects → c2 at 50). Forward-auth so C2 resolves the
    #      caller's role ON {project_id} (R-900-011). ----
    - match: PathRegexp(`^/api/v1/projects/[^/]+/backups(/.*)?$`)
      kind: Rule
      priority: 100
      services:
        - name: c16-backup
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # C16 tenant-scope backups (whole-tenant archive).
    - match: PathRegexp(`^/api/v1/tenants/[^/]+/backups(/.*)?$`)
      kind: Rule
      priority: 100
      services:
        - name: c16-backup
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C2 Projects (lifecycle + membership) — generic, priority 50 ----
    - match: PathPrefix(`/api/v1/projects`)
      kind: Rule
      priority: 50
      services:
        - name: c2-auth
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C2 Preferences ----
    - match: PathPrefix(`/api/v1/users/me/preferences`)
      kind: Rule
      priority: 50
      services:
        - name: c2-auth
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C6 Validation ----
    - match: PathPrefix(`/api/v1/validation`)
      kind: Rule
      priority: 50
      services:
        - name: c6-validation
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C7 Memory ----
    - match: PathPrefix(`/api/v1/memory`)
      kind: Rule
      priority: 50
      services:
        - name: c7-memory
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C9 MCP ----
    - match: PathPrefix(`/api/v1/mcp`)
      kind: Rule
      priority: 50
      services:
        - name: c9-mcp
          port: 8000
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- C12 uploads (n8n) ----
    - match: PathPrefix(`/uploads`)
      kind: Rule
      priority: 50
      services:
        - name: c12-workflow
          port: 5678
      middlewares:
        - name: forward-auth-c2
        - name: secure-headers
    # ---- UI catch-all (lowest priority) ----
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: ay-platform-ui
          port: 3000
