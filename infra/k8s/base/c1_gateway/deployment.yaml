# =============================================================================
# File: deployment.yaml
# Version: 7
# Path: infra/k8s/base/c1_gateway/deployment.yaml
# Description: Traefik v3 Deployment (C1 ingress tier). Uses the FILE
#              provider: the routing table is mounted from the generated
#              `c1-traefik-dynamic` ConfigMap, so Traefik holds NO Kubernetes
#              API permission at all (v4 — was the CRD provider, which
#              required a ClusterRole for a cluster-scoped `nodes` watch).
#              Routers and middlewares are shared verbatim with the compose
#              stack; only the backend binding differs per environment.
#
#              Public entry point exposed by `service.yaml` (Type:
#              LoadBalancer in production overlays; ClusterIP +
#              port-forward in kind/dev).
#
#              v5 (2026-09-09): the file provider points at the ConfigMap
#              volume's `..data` directory rather than the mount root, which
#              was loading every router / service / middleware TWICE. See the
#              comment on the `--providers.file.directory` argument below.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c1-gateway
  labels:
    app.kubernetes.io/name: c1-gateway
    app.kubernetes.io/component: c1
    app.kubernetes.io/part-of: aywizz-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c1-gateway
      app.kubernetes.io/component: c1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c1-gateway
        app.kubernetes.io/component: c1
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      serviceAccountName: traefik
      containers:
        - name: traefik
          image: traefik:v3.7.13
          imagePullPolicy: IfNotPresent
          args:
            - --entryPoints.web.address=:80
            - --entryPoints.traefik.address=:8080
            - --api.dashboard=true
            - --api.insecure=true
            # `ping` serves /ping on the `traefik` entrypoint (:8080) — the
            # target of the liveness/readiness probes. WITHOUT this, /ping 404s
            # and the liveness probe kills Traefik in a restart loop.
            - --ping=true
            - --ping.entryPoint=traefik
            # FILE provider (v4). Traefik reads its routing table from the
            # mounted ConfigMap and makes NO Kubernetes API call whatsoever —
            # hence no ServiceAccount rights, no Role, no ClusterRole, and no
            # CRD to install. Backends are reached by Service DNS, which needs
            # only cluster DNS.
            #
            # This replaced `--providers.kubernetescrd`. That provider forced a
            # ClusterRole, and not a small one: its shared informer watches
            # `nodes` — a CLUSTER-SCOPED resource that no namespaced Role can
            # ever grant. Verified experimentally on 2026-09-07: revoking
            # `nodes` and cold-restarting Traefik dropped the router table to
            # ZERO (every route 404), with
            # `failed to list *v1.Node: nodes is forbidden` in the logs. The
            # CRD provider therefore cannot coexist with a namespace-only
            # permission model.
            #
            # `watch: true` reloads on ConfigMap change (kubelet propagates a
            # ConfigMap update to the mounted volume within ~1 min), so route
            # changes need no pod restart.
            # Pointed at `..data`, NOT at the mount root. A ConfigMap volume is
            # materialised by kubelet as one real timestamped directory, a
            # `..data` symlink to it, and one symlink per key at the top level.
            # Traefik's file provider walks sub-directories, so aiming at the
            # root parsed every file TWICE — once via the key symlinks, once by
            # descending into the real directory — and logged exactly 28
            # routers + 11 services + 3 middlewares as "already configured,
            # skipping" (the declared counts, to the unit). Harmless in effect,
            # but it would swallow a GENUINE duplicate in the same noise.
            #
            # `..data` holds only the three real files and no sub-directory.
            # kubelet re-points that symlink ATOMICALLY on a ConfigMap update,
            # so `watch: true` still reloads without a pod restart — which is
            # why this beats the `subPath` alternative, where a mount receives
            # no updates at all and live reload dies.
            - --providers.file.directory=/etc/traefik/dynamic/..data
            - --providers.file.watch=true
            - --log.level=INFO
            - --accesslog=true
          # NO PROXY, EVER — and this is load-bearing on a managed cluster.
          #
          # Traefik is written in Go, and Go's `http.Transport` defaults to
          # `ProxyFromEnvironment`: it honours HTTP_PROXY / HTTPS_PROXY for
          # every connection it OPENS, which here means every call to a
          # backend Service. A cluster that injects a corporate proxy into
          # each pod therefore makes Traefik hand `http://ay-platform-ui:3000`
          # to a proxy that cannot resolve an in-cluster name — and the result
          # is 502 on EVERY route, with a perfectly healthy backend.
          #
          # THE SYMPTOM IS MISLEADING IN THREE WAYS (AKS, 2026-09-21):
          #   - inbound is unaffected (the proxy only touches connections
          #     Traefik opens), so the gateway answers, it just answers 502 ;
          #   - `/api/http/services/ui@file` reports `status: enabled` with the
          #     server UP, because with no `healthCheck` declared Traefik never
          #     probes its servers — "UP" means "configured", not "reachable" ;
          #   - the same backend answers 200 from any other pod, because a raw
          #     socket and urllib3 ignore these variables. Only the Go client
          #     fails, which is the same asymmetry that made `mc` and the
          #     ollama CLI fail while `arangosh` succeeded.
          #
          # EMPTIED RATHER THAN EXCLUDED VIA NO_PROXY. The `_init` Jobs and the
          # api tier APPEND to the inherited NO_PROXY because they also make
          # external calls. Traefik makes none: every one of its backends is an
          # in-cluster Service (see the `services.yml` binding), there is no
          # ACME resolver configured, and nothing else reaches out. A blanket
          # "no proxy" is therefore both correct and immune to the suffix trap
          # that a NO_PROXY list has to dodge — `.svc` never matches the
          # single-label `ay-platform-ui`.
          #
          # An empty value is what Go reads as "no proxy": it takes precedence
          # over anything the cluster injects, per-container. Harmless on
          # docker-desktop, where no proxy is injected in the first place.
          env:
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
          ports:
            - name: web
              containerPort: 80
              protocol: TCP
            - name: traefik
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: traefik
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "25m"
              memory: "64Mi"
          volumeMounts:
            - name: dynamic-config
              mountPath: /etc/traefik/dynamic
              readOnly: true
      volumes:
        # GENERATED by infra/c1_gateway/scripts/gen_k8s_c1_configmap.py from
        # the compose-shared routers.yml + middlewares.yml and the K8s
        # services.yml binding.
        - name: dynamic-config
          configMap:
            name: c1-traefik-dynamic
