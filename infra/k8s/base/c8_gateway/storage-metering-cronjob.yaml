# =============================================================================
# File: storage-metering-cronjob.yaml
# Version: 3
# Path: infra/k8s/base/c8_gateway/storage-metering-cronjob.yaml
# Description: Periodic per-project disk-storage metering pass (E-100-002 v7).
#              Runs the shared aywizz-api image with the storage snapshot
#              entrypoint, measuring every project's MinIO occupation and
#              appending one `storage_snapshots` row each. Out of band — talks to
#              MinIO + Arango directly (no HTTP, no forward-auth), so it never
#              depends on C1. Every 6h → the storage dashboards' day/week/month/
#              quarter/semester/year series. Absent MinIO endpoint → no-op.
#
# @relation implements:R-100-140
# =============================================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: c8-storage-metering
  labels:
    app.kubernetes.io/name: c8-storage-metering
    app.kubernetes.io/component: c8
    app.kubernetes.io/part-of: aywizz-platform
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: c8-storage-metering
            app.kubernetes.io/component: c8
            # WITHOUT THIS LABEL THE POD CANNOT REACH ANYTHING (2026-09-21).
            # `networkpolicies/allow-intra-platform` admits ingress only from
            # pods carrying `part-of: aywizz-platform`; everything else is cut
            # by `default-deny-ingress`. This CronJob carried the label on the
            # CronJob OBJECT but not on the pod template it creates — and a
            # NetworkPolicy matches the POD, never its owner. It was the only
            # one of 22 workloads in that state, which is exactly why it went
            # unnoticed: the policy is right, the fleet is right, and one
            # jobTemplate quietly opted itself out.
            #
            # This job talks straight to MinIO and ArangoDB (no HTTP hop, no
            # C1), so the label is the whole of its network authorisation.
            app.kubernetes.io/part-of: aywizz-platform
        spec:
          restartPolicy: Never
          containers:
            - name: metering
              image: ghcr.io/ayfondation/aywizz-api:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - ay_platform_core.c8_llm.storage.snapshot_job
              env:
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: MINIO_ENDPOINT
                  value: minio:9000
                - name: MINIO_BUCKET
                  value: orchestrator
                - name: MINIO_SECURE
                  value: "false"
              envFrom:
                # aywizz-config: ARANGO_URL / ARANGO_DB / ARANGO_USERNAME.
                # aywizz-secrets: ARANGO_PASSWORD + MINIO_ACCESS_KEY/SECRET_KEY.
                - configMapRef:
                    name: aywizz-config
                - secretRef:
                    name: aywizz-secrets
              resources:
                limits:
                  cpu: "100m"
                  memory: "256Mi"
                requests:
                  cpu: "25m"
                  memory: "96Mi"
