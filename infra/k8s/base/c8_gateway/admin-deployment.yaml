# =============================================================================
# File: admin-deployment.yaml
# Version: 3
# Path: infra/k8s/base/c8_gateway/admin-deployment.yaml
# Description: C8 admin app Deployment (LLM-governance: platform registry +
#              tenant catalogue + model-quality resolver). Shared `aywizz-api`
#              image, runtime selected via `COMPONENT_MODULE=c8_admin`. This is
#              the USER-FACING app of the C8 domain (behind C1 forward-auth),
#              distinct from the internal cost receiver.
#
#              The master key `AY_SECRET_MASTER_KEY` is sourced from
#              `aywizz-secrets` (operator `.env.secret`). When ABSENT the pod
#              still starts and serves the read / catalogue / resolve paths
#              (which C7 + the picker need) — only registry key WRITES are
#              disabled (503). So a missing master key never crash-loops the pod.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c8-admin
  namespace: aywizz
  labels:
    app.kubernetes.io/name: c8-admin
    app.kubernetes.io/component: c8
    app.kubernetes.io/part-of: aywizz-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c8-admin
      app.kubernetes.io/component: c8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8-admin
        app.kubernetes.io/component: c8
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      containers:
        - name: api
          image: ghcr.io/ayfondation/aywizz-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: COMPONENT_MODULE
              value: c8_admin
            - name: PYTHONUNBUFFERED
              value: "1"
            # MinIO — enables the per-project storage dashboards (E-100-002 v7).
            # Credentials (MINIO_ACCESS_KEY / MINIO_SECRET_KEY) come from
            # aywizz-secrets via envFrom; only the endpoint + bucket are set
            # here (same artifact store as C4). Absent endpoint → storage
            # metering disabled (endpoints answer 503), nothing else changes.
            - name: MINIO_ENDPOINT
              value: minio:9000
            - name: MINIO_BUCKET
              value: orchestrator
            - name: MINIO_SECURE
              value: "false"
            # D-011 / R-400-222 — best-effort re-embed trigger. On a
            # vector-affecting embedding-model edit or a project selection
            # change, c8_admin POSTs this C12/n8n webhook; the reembed_project
            # workflow then calls C7 /reembed as the system. Blank → disabled;
            # set here so the auto-trigger is live in-cluster.
            - name: C8_ADMIN_REEMBED_WEBHOOK_URL
              value: http://c12:5678/uploads/reembed-project
          envFrom:
            - configMapRef:
                name: aywizz-config
            - secretRef:
                name: aywizz-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "96Mi"
