# =============================================================================
# File: admin-deployment.yaml
# Version: 1
# Path: infra/k8s/base/c8_gateway/admin-deployment.yaml
# Description: C8 admin app Deployment (LLM-governance: platform registry +
#              tenant catalogue + model-quality resolver). Shared `aywizz-api`
#              image, runtime selected via `COMPONENT_MODULE=c8_admin`. This is
#              the USER-FACING app of the C8 domain (behind C1 forward-auth),
#              distinct from the internal cost receiver.
#
#              The master key `AY_SECRET_MASTER_KEY` is sourced from
#              `aywizz-secrets` (operator `.env.secret`). When ABSENT the pod
#              still starts and serves the read / catalogue / resolve paths
#              (which C7 + the picker need) — only registry key WRITES are
#              disabled (503). So a missing master key never crash-loops the pod.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: c8-admin
  namespace: aywizz
  labels:
    app.kubernetes.io/name: c8-admin
    app.kubernetes.io/component: c8
    app.kubernetes.io/part-of: aywizz-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c8-admin
      app.kubernetes.io/component: c8
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c8-admin
        app.kubernetes.io/component: c8
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      containers:
        - name: api
          image: ghcr.io/ayfondation/aywizz-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: COMPONENT_MODULE
              value: c8_admin
            - name: PYTHONUNBUFFERED
              value: "1"
          envFrom:
            - configMapRef:
                name: aywizz-config
            - secretRef:
                name: aywizz-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "300m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "96Mi"
