# =============================================================================
# File: networkpolicy.yaml
# Version: 2
# Path: infra/k8s/base/c4_workers/networkpolicy.yaml
# Description: Network containment for C4 sandbox pods (R-200-031). Two
#              policies, because in a single namespace both directions must
#              be stated:
#                1. EGRESS — a sandbox may leave only towards DNS, the C8
#                   LLM gateway and MinIO. No general internet egress; the
#                   provider sits BEHIND C8, never directly addressable
#                   (single-egress invariant, D-011).
#                2. INGRESS — MinIO and litellm must accept those calls.
#                   `default-deny-ingress` denies everything by default and
#                   `allow-intra-platform` only admits pods carrying
#                   `part-of: aywizz-platform`, which sandbox pods
#                   deliberately DO NOT carry: taking that label would open
#                   them to every platform pod, since that policy's
#                   podSelector is `{}`. Hence this narrow, explicit pair.
#
#              v2 (2026-09-08) — single-namespace deployment. Sandboxes now
#              run in `aywizz`, so the egress rules select pods in the same
#              namespace and a companion ingress policy is required (in the
#              two-namespace layout `allow-intra-platform` was never in the
#              way). Namespaces are applied by the bundle transformer.
#
#              CAVEAT, unchanged and important: Docker Desktop's K8s ships a
#              CNI that does NOT enforce NetworkPolicies, so ALL of this is a
#              NO-OP in local dev — a sandbox there can reach ArangoDB, MinIO
#              and the API server freely. It is enforced on a cluster running
#              Calico/Cilium. The contract lives in the manifest either way;
#              do not mistake it for an active control in dev.
#
# @relation implements:R-200-031
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: c4-sub-agent-egress
  labels:
    app.kubernetes.io/name: c4-sub-agent-egress
    app.kubernetes.io/part-of: aywizz-platform
spec:
  # The K8sDispatcher stamps `app.kubernetes.io/name=c4-sub-agent` on every
  # sandbox pod it creates.
  podSelector:
    matchLabels:
      app.kubernetes.io/name: c4-sub-agent
  policyTypes:
    - Egress
  egress:
    # 1) DNS — kube-system :53 UDP+TCP.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # 2) C8 LLM gateway (LiteLLM proxy) :4000.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: litellm
      ports:
        - protocol: TCP
          port: 4000
    # 3) MinIO :9000 — where the sub-agent reads its bundle and writes
    #    completion.json (R-200-033).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: minio
      ports:
        - protocol: TCP
          port: 9000
---
# Companion ingress: without it the two egress targets above would still
# refuse the connection, because sandbox pods are not `part-of` the platform.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sub-agent-to-llm-and-storage
  labels:
    app.kubernetes.io/name: allow-sub-agent-to-llm-and-storage
    app.kubernetes.io/part-of: aywizz-platform
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: ["litellm", "minio"]
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: c4-sub-agent
      ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 9000
