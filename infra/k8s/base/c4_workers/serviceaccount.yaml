# =============================================================================
# File: serviceaccount.yaml
# Version: 3
# Path: infra/k8s/base/c4_workers/serviceaccount.yaml
# Description: Identity assigned to every C4 sandbox Pod. Holds NO
#              permissions, and `automountServiceAccountToken: false` means
#              the pod does not even receive an API token — defense in depth,
#              because a sandbox runs LLM-generated code.
#
#              v3 (2026-09-08): the explicit `namespace: c4-workers` is gone;
#              the bundle's namespace transformer places this SA in `aywizz`
#              (single-namespace deployment — see kustomization.yaml v2).
#              v2 (2026-05-27): the `c4-orchestrator` SA moved to
#              base/c4_orchestrator/serviceaccount.yaml so it travels with
#              its Deployment and exists even when this layer is not applied.
#
# @relation implements:R-200-030
# =============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: c4-sub-agent
  labels:
    app.kubernetes.io/name: c4-sub-agent
    app.kubernetes.io/part-of: aywizz-platform
automountServiceAccountToken: false
