# =============================================================================
# File: minio-init.yaml
# Version: 7
# Path: infra/k8s/base/_init/minio-init.yaml
# Description: One-shot Job creating MinIO buckets + app user with a
#              readwrite policy (R-100-118 v2). Idempotent: existing
#              buckets / users / policy are skipped or updated in place.
#              v2: adds the C13 extractor artifact bucket
#              (`c13-extractor-artifacts`) to the bucket set + policy, so a
#              C13-enabled overlay has a writable target (R-100-125).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  annotations:
    # See arangodb-init.yaml for the full rationale. Short form: a Job's
    # `spec.template` is immutable, so ArgoCD cannot patch this Job's changed
    # image and keeps the old one — which on 2026-09-15 meant it kept pulling
    # `minio/mc` from Docker Hub, a repository that no longer serves public
    # pulls. Inert outside ArgoCD.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/component: c10
    app.kubernetes.io/part-of: aywizz-platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/component: c10
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          # Required wherever a namespace ResourceQuota is in force: a pod
          # without limits is REFUSED, and a refused Job pod looks like a
          # failed Job. See arangodb-init.yaml for the full note.
          # `mc` creates buckets, a policy and a user — a few API calls.
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          env:
            # Lets the endpoint below be written as an FQDN without pinning a
            # namespace into `base/`.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          envFrom:
            - configMapRef:
                name: aywizz-config
            - secretRef:
                name: aywizz-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # ROOT USER DEFAULTS, and it must match the StatefulSet. That one
              # sets `MINIO_ROOT_USER: minioadmin` as a LITERAL with a comment
              # saying "minio-init connects with the same value via the
              # configmap" — but the key was never added to
              # .env.config.example, so on a fresh AKS namespace it arrived
              # EMPTY and `mc alias set` failed on every attempt
              # (2026-09-17). Defaulting to the same literal makes the two
              # agree by construction instead of by an operator remembering.
              MINIO_ROOT_USER="${MINIO_ROOT_USER:-minioadmin}"
              if [ -z "$MINIO_ROOT_PASSWORD" ]; then
                echo "[minio-init] FATAL: MINIO_ROOT_PASSWORD is empty." >&2
                echo "[minio-init] It must be set in aywizz-secrets" >&2
                echo "[minio-init] (overlays/<env>/.env.secret). The MinIO" >&2
                echo "[minio-init] StatefulSet reads the same key." >&2
                exit 1
              fi
              # This Job creates the APPLICATION credentials. The components'
              # `wait-for-deps` probe MinIO unauthenticated, so they will pass
              # their wait even if this Job never runs — and then fail in
              # their own startup on ensure_bucket(). That makes these logs
              # the place the trail goes cold, so nothing is swallowed here.
              # STABLE PER-POD DNS, not the bare Service name (2026-09-17).
              # `minio` is a HEADLESS service: it resolves to the set of ready
              # endpoints, while `minio-0.minio` is the canonical, deterministic
              # address of one StatefulSet pod. `mc` failed against
              # `http://minio:9000` with "Connection closed by foreign host" —
              # reproducibly, and even FROM INSIDE minio-0 itself, while
              # `http://127.0.0.1:9000` succeeded with the same credentials and
              # the same binary. Same pod, same secret, only the hostname
              # differed, so the server and the credentials are both exonerated.
              #
              # Overridable from aywizz-config so the two forms can be compared
              # without editing this manifest.
              # APPEND to the proxy exclusions, never replace them. A cluster
              # that injects HTTP_PROXY also injects a NO_PROXY carrying
              # entries this platform must not drop (the cloud metadata
              # endpoint, internal ranges). We only add what is missing: the
              # in-cluster names this Job talks to.
              #
              # `mc` is written in Go and honours these variables natively, so
              # without the exclusion it hands `minio:9000` to a proxy that
              # cannot route it, and the proxy closes the connection —
              # "Connection closed by foreign host", with a perfectly healthy
              # server (2026-09-17). `arangosh` ignores proxy variables
              # entirely, which is why arangodb-init never showed this.
              #
              # SUFFIX MATCHING NEVER COVERS A SINGLE-LABEL NAME: `.svc` does
              # not match `minio`. The bare names have to be listed.
              _NP="localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local,minio"
              NO_PROXY="${NO_PROXY:+${NO_PROXY},}${_NP}"
              no_proxy="${no_proxy:+${no_proxy},}${_NP}"
              export NO_PROXY no_proxy
              echo "[minio-init] no_proxy    : ${NO_PROXY}"
              # FQDN, not the short name — and this is the load-bearing part.
              # A cluster NO_PROXY typically already carries `.svc` and
              # `.svc.cluster.local`, but those are SUFFIXES and a suffix never
              # matches a single-label host: `.svc` does NOT cover `minio`.
              # Writing the name in the form the existing exclusions already
              # describe fixes this without anyone editing NO_PROXY.
              # Namespace comes from the downward API, so this stays correct
              # wherever the platform is installed.
              MINIO_INIT_ENDPOINT="${MINIO_INIT_ENDPOINT:-http://minio.${POD_NAMESPACE}.svc:9000}"
              echo "[minio-init] target     : $MINIO_INIT_ENDPOINT"
              echo "[minio-init] root user  : $MINIO_ROOT_USER"
              echo "[minio-init] app user   : $MINIO_ACCESS_KEY"
              echo "[minio-init] waiting for minio to accept an admin alias"
              attempt=0
              until out="$(mc alias set local "$MINIO_INIT_ENDPOINT" "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" 2>&1)"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -le 10 ] || [ $((attempt % 10)) -eq 0 ]; then
                  echo "[minio-init] not ready ($((attempt * 2))s, attempt $attempt): $out"
                fi
                sleep 2
              done
              echo "[minio-init] minio reachable after $((attempt * 2))s"
              echo "[minio-init] ensuring buckets"
              for b in orchestrator requirements validation memory c13-extractor-artifacts backups; do
                mc mb --ignore-existing "local/$b"
              done
              echo "[minio-init] ensuring policy ay-app-readwrite"
              cat > /tmp/policy.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  { "Effect": "Allow",
                    "Action": ["s3:*"],
                    "Resource": [
                      "arn:aws:s3:::orchestrator", "arn:aws:s3:::orchestrator/*",
                      "arn:aws:s3:::requirements", "arn:aws:s3:::requirements/*",
                      "arn:aws:s3:::validation",   "arn:aws:s3:::validation/*",
                      "arn:aws:s3:::memory",       "arn:aws:s3:::memory/*",
                      "arn:aws:s3:::c13-extractor-artifacts",
                      "arn:aws:s3:::c13-extractor-artifacts/*",
                      "arn:aws:s3:::backups", "arn:aws:s3:::backups/*"
                    ]
                  }
                ]
              }
              POLICY
              mc admin policy create local ay-app-readwrite /tmp/policy.json || true
              echo "[minio-init] ensuring app user $MINIO_ACCESS_KEY + policy attachment"
              mc admin user add local "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" || \
                mc admin user svcacct edit local "$MINIO_ACCESS_KEY" --secret-key "$MINIO_SECRET_KEY" || true
              mc admin policy attach local ay-app-readwrite --user "$MINIO_ACCESS_KEY" || true
              echo "[minio-init] DONE — buckets, policy and app credentials in place"
