# =============================================================================
# File: minio-init.yaml
# Version: 6
# Path: infra/k8s/base/_init/minio-init.yaml
# Description: One-shot Job creating MinIO buckets + app user with a
#              readwrite policy (R-100-118 v2). Idempotent: existing
#              buckets / users / policy are skipped or updated in place.
#              v2: adds the C13 extractor artifact bucket
#              (`c13-extractor-artifacts`) to the bucket set + policy, so a
#              C13-enabled overlay has a writable target (R-100-125).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  annotations:
    # See arangodb-init.yaml for the full rationale. Short form: a Job's
    # `spec.template` is immutable, so ArgoCD cannot patch this Job's changed
    # image and keeps the old one — which on 2026-09-15 meant it kept pulling
    # `minio/mc` from Docker Hub, a repository that no longer serves public
    # pulls. Inert outside ArgoCD.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
  labels:
    app.kubernetes.io/name: minio-init
    app.kubernetes.io/component: c10
    app.kubernetes.io/part-of: aywizz-platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
        app.kubernetes.io/component: c10
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
          imagePullPolicy: IfNotPresent
          # Required wherever a namespace ResourceQuota is in force: a pod
          # without limits is REFUSED, and a refused Job pod looks like a
          # failed Job. See arangodb-init.yaml for the full note.
          # `mc` creates buckets, a policy and a user — a few API calls.
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          envFrom:
            - configMapRef:
                name: aywizz-config
            - secretRef:
                name: aywizz-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for minio readiness"
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                sleep 2
              done
              echo "Ensuring buckets"
              for b in orchestrator requirements validation memory c13-extractor-artifacts backups; do
                mc mb --ignore-existing "local/$b"
              done
              echo "Ensuring policy ay-app-readwrite"
              cat > /tmp/policy.json <<'POLICY'
              {
                "Version": "2012-10-17",
                "Statement": [
                  { "Effect": "Allow",
                    "Action": ["s3:*"],
                    "Resource": [
                      "arn:aws:s3:::orchestrator", "arn:aws:s3:::orchestrator/*",
                      "arn:aws:s3:::requirements", "arn:aws:s3:::requirements/*",
                      "arn:aws:s3:::validation",   "arn:aws:s3:::validation/*",
                      "arn:aws:s3:::memory",       "arn:aws:s3:::memory/*",
                      "arn:aws:s3:::c13-extractor-artifacts",
                      "arn:aws:s3:::c13-extractor-artifacts/*",
                      "arn:aws:s3:::backups", "arn:aws:s3:::backups/*"
                    ]
                  }
                ]
              }
              POLICY
              mc admin policy create local ay-app-readwrite /tmp/policy.json || true
              echo "Ensuring app user $MINIO_ACCESS_KEY"
              mc admin user add local "$MINIO_ACCESS_KEY" "$MINIO_SECRET_KEY" || \
                mc admin user svcacct edit local "$MINIO_ACCESS_KEY" --secret-key "$MINIO_SECRET_KEY" || true
              mc admin policy attach local ay-app-readwrite --user "$MINIO_ACCESS_KEY" || true
              echo "MinIO bootstrap done."
