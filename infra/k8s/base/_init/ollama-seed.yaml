# =============================================================================
# File: ollama-seed.yaml
# Version: 7
# Path: infra/k8s/base/_init/ollama-seed.yaml
# Description: One-shot Job pulling an embedding model into Ollama's
#              persistent cache so it is available to REGISTER as an in-app
#              embedding provider (D-011). Skipped on subsequent runs by Ollama
#              itself (model already present). The model is seed-local
#              (`OLLAMA_SEED_MODEL`, default all-minilm) — no longer tied to a
#              C7 env knob (those were removed when embedding selection moved
#              in-app).
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: ollama-seed
  annotations:
    # See arangodb-init.yaml for the full rationale: a Job's `spec.template` is
    # immutable, so a changed image cannot be patched and ArgoCD would keep the
    # old Job. Inert outside ArgoCD.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
  labels:
    app.kubernetes.io/name: ollama-seed
    app.kubernetes.io/component: ollama
    app.kubernetes.io/part-of: aywizz-platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama-seed
        app.kubernetes.io/component: ollama
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ollama-pull
          image: ollama/ollama:0.34.0
          imagePullPolicy: IfNotPresent
          # Required wherever a namespace ResourceQuota is in force — see
          # arangodb-init.yaml. This container only DRIVES the pull: the model
          # is downloaded and written by the ollama SERVER, so the work here is
          # an HTTP client waiting on a 45 MB transfer, not the transfer's
          # memory cost.
          resources:
            requests:
              cpu: "25m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "256Mi"
          # Pulls in NO_PROXY / no_proxy where the cluster injects a corporate
          # HTTP proxy: the ollama CLI is written in Go and honours those
          # variables, so without the in-cluster exclusions it hands
          # `ollama:11434` to a proxy that cannot route it and reports
          # "something went wrong" while the server is healthy. The explicit
          # `env:` below still wins over anything of the same name here.
          envFrom:
            - configMapRef:
                name: aywizz-config
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OLLAMA_HOST
              # HOST:PORT, no scheme. `http://ollama:11434` is what this
              # carried under ollama 0.5.4; the 0.34.0 CLI does not accept it
              # and fails with the unhelpful "something went wrong, please see
              # the ollama server logs" — while the server logs show nothing,
              # because the request never arrives (2026-09-17).
              #
              # Proven in the pod: `OLLAMA_HOST=127.0.0.1:11434 ollama list`
              # returns a well-formed empty list, the scheme-carrying form
              # does not. A silent parsing change across twenty months of
              # upstream, surfaced by the image bump.
              value: "ollama:11434"
            # Seed-local model id (not a C7 config knob). Override only to seed
            # a different embedding model for in-app registration.
            - name: OLLAMA_SEED_MODEL
              value: "all-minilm"
          command:
            - /bin/sh
            - -c
            - |
              set -e
              # APPEND to the proxy exclusions, never replace them — see
              # _init/minio-init.yaml for the full rationale. The ollama CLI
              # is written in Go and honours these variables, so without the
              # exclusion it hands `ollama:11434` to a proxy that cannot route
              # it and reports "something went wrong, please see the ollama
              # server logs" — while those logs show nothing, because the
              # request never arrives.
              _NP="localhost,127.0.0.1,::1,.svc,.svc.cluster.local,.cluster.local,ollama"
              NO_PROXY="${NO_PROXY:+${NO_PROXY},}${_NP}"
              no_proxy="${no_proxy:+${no_proxy},}${_NP}"
              export NO_PROXY no_proxy
              echo "[ollama-seed] no_proxy : ${NO_PROXY}"
              # FQDN for the same reason as minio-init: a cluster NO_PROXY
              # carries `.svc` as a SUFFIX, and a suffix never matches the
              # single-label `ollama`. Written this way it is covered by the
              # exclusions that already exist.
              OLLAMA_HOST="ollama.${POD_NAMESPACE}.svc:11434"
              export OLLAMA_HOST
              MODEL="${OLLAMA_SEED_MODEL:-all-minilm}"
              echo "[ollama-seed] target : ${OLLAMA_HOST:-<unset>}"
              echo "[ollama-seed] model  : $MODEL"
              echo "[ollama-seed] waiting for the server to answer 'ollama list'"
              attempt=0
              until out="$(ollama list 2>&1)"; do
                attempt=$((attempt + 1))
                if [ "$attempt" -le 10 ] || [ $((attempt % 10)) -eq 0 ]; then
                  echo "[ollama-seed] not ready ($((attempt * 2))s, attempt $attempt): $out"
                fi
                sleep 2
              done
              echo "[ollama-seed] server reachable after $((attempt * 2))s"
              echo "[ollama-seed] models already present:"
              echo "$out"
              echo "[ollama-seed] pulling $MODEL (this is the server's download, not ours)"
              ollama pull "$MODEL"
              echo "[ollama-seed] DONE — $MODEL available for the embedding registry"
