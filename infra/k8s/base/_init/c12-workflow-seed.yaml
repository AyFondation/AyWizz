# =============================================================================
# File: c12-workflow-seed.yaml
# Version: 6
# Path: infra/k8s/base/_init/c12-workflow-seed.yaml
# Description: One-shot Job importing every workflow JSON under the
#              c12-workflow-files ConfigMap into the running n8n.
#              Idempotent: re-imports update workflows in place.
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: c12-workflow-seed
  annotations:
    # See arangodb-init.yaml for the full rationale. This Job is the most
    # exposed of the four: the n8n 2.x migration changed BOTH its image and its
    # whole command (`publish:workflow` replacing the removed
    # `update:workflow --all`). Without a delete-and-recreate, ArgoCD keeps the
    # old Job and the ingestion webhooks stay unregistered — green sync, dead
    # chain. Inert outside ArgoCD.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
  labels:
    app.kubernetes.io/name: c12-workflow-seed
    app.kubernetes.io/component: c12
    app.kubernetes.io/part-of: aywizz-platform
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c12-workflow-seed
        app.kubernetes.io/component: c12
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      restartPolicy: OnFailure
      # Same volume, same UID mismatch, same fix as c12_workflow/deployment.yaml
      # — see the full rationale there. This Job mounts `c12-data` too, so
      # without it the seed fails on the identical
      # `EACCES ... /home/node/.n8n/config`. It MUST stay in step with the
      # Deployment: the two write the same SQLite DB, and a volume chowned by
      # one and not the other is worse than neither.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: n8n-import
          image: n8nio/n8n:2.38.7
          imagePullPolicy: IfNotPresent
          # Required wherever a namespace ResourceQuota is in force — see
          # arangodb-init.yaml. Sized ABOVE the other init containers because
          # this one is not a thin client: `n8n import:workflow` boots the n8n
          # runtime and runs the full SQLite migration chain (visible in its
          # own logs) before importing. The main c12 container requests
          # 50m/256Mi with a 500m/1024Mi limit; this does the same work in a
          # burst, so it gets the same ceiling.
          resources:
            requests:
              cpu: "25m"
              memory: "256Mi"
            limits:
              cpu: "100m"
              memory: "1024Mi"
          env:
            - name: DB_TYPE
              value: "sqlite"
            - name: DB_SQLITE_DATABASE
              value: "/home/node/.n8n/database.sqlite"
            - name: N8N_PORT
              value: "5678"
          volumeMounts:
            - name: data
              mountPath: /home/node/.n8n
            - name: workflows
              mountPath: /workflows
              readOnly: true
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for c12-workflow readiness"
              until wget --spider -q http://c12-workflow.aywizz.svc.cluster.local:5678/healthz 2>/dev/null; do
                sleep 2
              done
              echo "Importing n8n workflows from /workflows"
              n8n import:workflow --separate --input=/workflows
              # n8n 2.x removed `update:workflow --all --active=true`
              # ("no longer supported"), and `import:workflow` DEACTIVATES
              # what it imports. Publishing is now per workflow id. The
              # `|| true` that used to trail the old command is gone on
              # purpose: it swallowed the 2.x removal, so the seed reported
              # success while both webhooks stayed unregistered — an
              # ingestion chain that is down but green.
              echo "Publishing imported workflows"
              for wf in /workflows/*.json; do
                wf_id="$(node -p "require('${wf}').id")"
                echo "  publishing ${wf_id}"
                n8n publish:workflow --id="${wf_id}"
              done
              echo "Seeding done."
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: c12-data
        - name: workflows
          configMap:
            name: c12-workflow-files
            optional: true
