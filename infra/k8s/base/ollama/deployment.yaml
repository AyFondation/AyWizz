# =============================================================================
# File: deployment.yaml
# Version: 5
# Path: infra/k8s/base/ollama/deployment.yaml
# Description: Ollama embeddings provider — production C7 default
#              (`C7_EMBEDDING_ADAPTER=ollama`, `all-minilm` model). Single
#              replica with model cache on a persistent volume so the
#              ~46 MB model is downloaded once. CPU inference; no GPU
#              support requested in v1.
#
#              Resource budget mirrors docker-compose v6: limit
#              2.0 vCPU / 2 GB, reserve 0.5 / 1 GB.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app.kubernetes.io/name: ollama
    app.kubernetes.io/component: ollama
    app.kubernetes.io/part-of: aywizz-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ollama
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ollama
        app.kubernetes.io/component: ollama
        app.kubernetes.io/part-of: aywizz-platform
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:0.34.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: ollama
              containerPort: 11434
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /root/.ollama
          # HTTP, not exec. The previous `ollama list` probe was justified by
          # "curl is not in the image" — but an httpGet probe is performed by
          # the KUBELET, from outside the container, so curl's absence was
          # never an obstacle. The `tcpSocket` liveness probe below was always
          # the proof of that.
          #
          # It stopped being merely wasteful and started failing on AKS
          # (2026-09-17): every 5 seconds the exec forked a shell and loaded
          # the ollama binary, which grew by orders of magnitude between 0.5.4
          # and 0.34.0 (a 3.7 GB image). Cold, under a CPU limit, that exceeds
          # `timeoutSeconds: 3` — while the same command run by hand returns
          # instantly, because the binary is already in page cache. The probe
          # was measuring process startup, not service health.
          #
          # `/api/tags` rather than `/`: it exercises the API layer and returns
          # the model list, so a server that is listening but not serving is
          # still reported unready.
          readinessProbe:
            httpGet:
              path: /api/tags
              port: ollama
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 40
          livenessProbe:
            tcpSocket:
              port: ollama
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "200m"
              memory: "2048Mi"
            requests:
              # Serves EMBEDDINGS only (all-minilm, 22M params, ~45MB — see
              # _init/ollama-seed.yaml), not generation. Idle between
              # ingestions, milliseconds per chunk when active: the load is
              # bursty, so the reservation is small and the 2000m limit
              # carries the burst.
              cpu: "25m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: ollama-data
