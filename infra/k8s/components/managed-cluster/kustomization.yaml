# =============================================================================
# File: kustomization.yaml
# Version: 2
# Path: infra/k8s/components/managed-cluster/kustomization.yaml
# Description: Kustomize COMPONENT carrying everything that differs on a cluster
#              with NO local Docker image store — AKS today, any managed or
#              multi-node cluster tomorrow.
#
#              WHY A COMPONENT AND NOT A PATCH IN AN OVERLAY. The same
#              `overlays/dev` is deployed to two very different targets: the
#              local docker-desktop cluster AND AKS. Kustomize has no
#              conditionals, so the difference cannot live inside `dev` itself —
#              it has to be a slice that one target composes in and the other
#              does not. A Component is exactly that: `overlays/dev-aks` is
#              `overlays/dev` PLUS this, and `overlays/dev` stays byte-for-byte
#              what it always was for local work.
#
#              WHAT GOES IN HERE. Anything that is true of a managed cluster and
#              false locally. Today that is the image pull policy; the obvious
#              future tenants are `imagePullSecrets` (needed the moment the GHCR
#              packages are private — NOT declared anywhere yet, see
#              VERSIONING.md §10), a cloud `ingressClassName`, and a cloud
#              StorageClass. Add them here rather than forking the overlay.
#
#              WHAT MUST NOT GO IN HERE. Anything the local cluster also needs.
#              A Component is invisible until composed, so a rule placed here
#              silently does not apply to `overlays/dev` — which is the point,
#              and also the trap.
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

# EVERY image the build declares, not just the convenient ones. Four targets
# rather than one because JSON6902 `replace` fails on a path that does not
# exist, and the four pod-template shapes sit at four different paths:
# Deployment/StatefulSet `.spec.template`, CronJob `.spec.jobTemplate.spec
# .template`, and initContainers in their own array. Verify coverage with
#   kubectl kustomize infra/k8s/overlays/dev-aks | grep -c "imagePullPolicy: Always"
# against the total count of `imagePullPolicy` — the two must match (24 today).
patches:
  - path: patch-image-pull-policy.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  - path: patch-image-pull-policy.yaml
    target:
      group: apps
      version: v1
      kind: StatefulSet
  - path: patch-image-pull-policy-job.yaml
    target:
      group: batch
      version: v1
      kind: Job
  - path: patch-image-pull-policy-cronjob.yaml
    target:
      group: batch
      version: v1
      kind: CronJob
  # Named targets: an untargeted initContainer patch would fail the build on
  # every Deployment that has none (JSON6902 `replace` errors on a missing
  # path). c12-workflow carries the n8n workflow importer; the other nine
  # carry `wait-for-deps` from the `wait-for-deps` COMPONENT — which is why
  # THAT COMPONENT MUST BE COMPOSED BEFORE THIS ONE in an overlay's
  # `components:` list. Compose it after, and these paths do not exist yet,
  # the patch silently matches nothing, and nine initContainers keep
  # `IfNotPresent` on a cluster with no image store.
  - path: patch-image-pull-policy-initcontainer.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: "^(c12-workflow|c2-auth|c3-conversation|c4-orchestrator|c5-requirements|c6-validation|c7-memory|c8-admin|c8-cost-receiver|c16-backup)$"
