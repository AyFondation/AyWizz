# =============================================================================
# File: patch-image-pull-policy.yaml
# Version: 2
# Path: infra/k8s/components/managed-cluster/patch-image-pull-policy.yaml
# Description: Forces `imagePullPolicy: Always` on every long-running workload
#              container, for MANAGED clusters only (AKS and anything else with
#              no local image store).
#
#              WHY A PROD-OVERLAY PATCH AND NOT A `base/` CHANGE. Putting this
#              in `base/` looks tidier and would break local development.
#              The dev images are built locally, and c13/c15 are not published
#              at all — `ghcr.io/ayfondation/…` is a NAMING CONVENTION there,
#              not an address. docker-desktop shares its image store with the
#              cluster and `IfNotPresent` is what makes that work: the kubelet
#              finds the image you just built and never contacts a registry.
#              `Always` in `base/` would force a pull on the dev cluster, where
#              api/ui would be silently REPLACED by whatever GHCR holds — the
#              last COMMIT PUSHED, which is never what a developer is testing.
#              Uncommitted work would vanish from a deploy that reported
#              success. (On 2026-09-14, GHCR's `aywizz-api:latest` was
#              `sha-7be1f53` — HEAD — while six independent workstreams sat
#              uncommitted in the tree. A pull would have discarded all of
#              them.)
#
#              ON A PINNED TAG THIS IS A NO-OP, by design. `kustomization.yaml`
#              pins every platform image to `sha-<commit>`, which is immutable:
#              `Always` then costs one registry round-trip per pod start and
#              changes nothing. It earns its place the moment a deployment uses
#              a FLOATING tag (`:latest`, `:main`, `:beta`), where
#              `IfNotPresent` means "keep whatever this node happens to have" —
#              the managed-cluster form of the phantom deploy already hit in
#              dev on 2026-09-02.
#
#              Getting the newest code onto a managed cluster is therefore TWO
#              things, not one: this policy AND an updated sha pin. The policy
#              alone guarantees nothing.
#
#              SCOPE (v2, 2026-09-15): this file covers the FIRST container of
#              Deployments and StatefulSets. It is no longer the whole story —
#              `kustomization.yaml` now composes three sibling patches so the
#              policy reaches EVERY image: initContainers, Jobs and CronJobs.
#
#              v1 excluded all batch workloads, reasoning that they "execute
#              once at install and then stay Completed". That held for a
#              bootstrap Job and was simply wrong for a CronJob:
#              `c8-storage-metering` recurs forever on a floating
#              `aywizz-api:latest`, so `IfNotPresent` pinned it to whatever its
#              node cached first. The exclusion was written from the shape of
#              the resource (`kind: Job`-ish) instead of its lifecycle, which
#              is the actual discriminator.
#
#              `replace` (not `add`) is safe because every container in the
#              tree declares `imagePullPolicy` explicitly — a NEW container
#              that omits it will fail the build here rather than silently
#              keep the default, which is the behaviour we want.
# =============================================================================
- op: replace
  path: /spec/template/spec/containers/0/imagePullPolicy
  value: Always
