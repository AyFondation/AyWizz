# =============================================================================
# File: patch-wait-for-deps.yaml
# Version: 2
# Path: infra/k8s/components/wait-for-deps/patch-wait-for-deps.yaml
# Description: A `wait-for-deps` initContainer for every API-tier component
#              whose startup lifespan touches ArangoDB or MinIO.
#
#              WHY THIS EXISTS — A COMPOSE GUARANTEE THAT DID NOT SURVIVE THE
#              PORT TO KUBERNETES. `tests/docker-compose.yml` declares
#              `depends_on: {arangodb: {condition: service_healthy}}` on every
#              such service, and Compose BLOCKS the container until that holds.
#              Kubernetes has no equivalent: all pods start at once. The port
#              was made without replacing that guarantee, so each component
#              simply raced its database — and lost silently.
#
#              HOW IT PRESENTED (AKS, 2026-09-15). Nine of the ten pods built
#              from `aywizz-api` failed their readiness probe; the tenth,
#              `c9-mcp`, was fine — it is a pure proxy and touches no storage.
#              The logs showed `RemoteDisconnected('Remote end closed
#              connection without response')` against
#              `http://arangodb:8529/_db/platform/_api/collection`, then
#              `Application startup failed. Exiting.` EIGHTEEN SECONDS after
#              start: python-arango retries 3 times and gives up, the lifespan
#              raises, uvicorn exits. A fresh ArangoDB on an Azure Disk is not
#              serving by then.
#
#              Note what the error was NOT, because both readings were tried
#              and both were wrong: a NetworkPolicy drop yields a TIMEOUT, not
#              an established connection; bad credentials yield HTTP 401, which
#              is a response. `RemoteDisconnected` means the socket opened and
#              closed with nothing spoken — a server that is up but not yet
#              serving.
#
#              WHY IT NEVER BIT LOCALLY. docker-desktop starts ArangoDB from a
#              warm image on local disk in ~2s, inside the 18s budget. When it
#              does not, one restart absorbs it — `c4-orchestrator` did exactly
#              that on 2026-09-15 (1 restart, then stable) and the defect read
#              as noise rather than as the same bug at smaller scale.
#
#              WHAT IT WAITS FOR — the actual precondition, not a port. BOTH
#              checks are AUTHENTICATED, with the application's own
#              credentials, because in both cases the credential is created by
#              a bootstrap Job and its absence is the failure being guarded
#              against:
#                - ArangoDB: a GET on `/_db/$ARANGO_DB/_api/collection` as the
#                  app user proves arangod serves, the database exists and the
#                  user can read it — i.e. that `arangodb-init` ran ;
#                - MinIO: a HeadBucket with the app key proves `minio-init`
#                  created the account and attached its policy.
#              Waiting for a port to accept a socket would prove none of that —
#              and accepting the socket is precisely what both were already
#              doing while the platform could not start.
#
#              v2 closed a gap here: the MinIO check was initially an
#              UNAUTHENTICATED liveness call, so it passed whenever the server
#              was up, even with no application credentials at all. The
#              component then failed in its own startup on `ensure_bucket()` —
#              the exact shape of failure this container exists to remove,
#              merely moved one step later.
#
#              IMAGE: the api image itself. It is already being pulled for the
#              main container, carries python3, and adds no new registry
#              dependency — which matters after MinIO's Docker Hub
#              repositories stopped serving public pulls (see
#              infra/scripts/_kind_preload.sh).
#
#              SCOPE: the nine storage-touching Deployments, enumerated in
#              `kustomization.yaml`. `c9-mcp` is deliberately absent. A NEW
#              component that reads storage at startup MUST be added to that
#              list — nothing detects the omission; it will simply race, and
#              win locally.
#
#              WHY A COMPONENT AND NOT `base/kustomization.yaml`. It was put
#              there first and applied to NOTHING that mattered: `overlays/dev`
#              and `overlays/system-test` list `../../base/<component>`
#              individually and never evaluate `base/kustomization.yaml` —
#              only `overlays/prod` composes `../../base`. A cross-cutting
#              patch therefore has to be a Component each overlay composes by
#              name, which is also what makes its scope visible from the
#              overlay rather than hidden two directories down.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: PATCHED-BY-TARGET
spec:
  template:
    spec:
      initContainers:
        - name: wait-for-deps
          image: ghcr.io/ayfondation/aywizz-api:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: aywizz-config
            - secretRef:
                name: aywizz-secrets
          command:
            - python3
            - -c
            - |
              import base64, os, time, urllib.error, urllib.request

              timeout = float(os.environ.get("WAIT_FOR_DEPS_TIMEOUT", "600"))
              deadline = time.monotonic() + timeout

              def required(key):
                  """Fail with the missing KEY NAME, not a bare KeyError.

                  This container now gates pod startup, so a config gap here
                  stops the pod instead of the app — worth one readable line
                  saying which key and where it comes from."""
                  value = os.environ.get(key)
                  if not value:
                      raise SystemExit(
                          f"wait-for-deps: {key} is unset or empty. It comes "
                          f"from the aywizz-config ConfigMap or the "
                          f"aywizz-secrets Secret (overlays/<env>/.env.config "
                          f"/ .env.secret)."
                      )
                  return value

              def log(msg):
                  print(f"[wait-for-deps] {msg}", flush=True)

              # Status → the thing an operator should go look at. A raw "HTTP
              # 401" sends people hunting for a wrong password; on this
              # endpoint it almost always means the bootstrap Job has not run.
              HINTS = {
                  401: "credentials rejected — arangodb-init has probably not "
                       "created the application user yet (check: kubectl logs "
                       "job/arangodb-init)",
                  403: "authenticated but not authorised — the user exists "
                       "without a grant on this database",
                  404: "database or endpoint missing — arangodb-init has "
                       "probably not created it yet",
                  503: "the service answered but is not ready to serve",
              }

              # S3 error codes are strings, and MinIO's are unusually precise
              # about which half of the bootstrap is missing.
              S3_HINTS = {
                  "InvalidAccessKeyId":
                      "the application access key does not exist — minio-init "
                      "has probably not run (check: kubectl logs job/minio-init)",
                  "SignatureDoesNotMatch":
                      "the access key exists but the secret differs — the "
                      "aywizz-secrets value and the stored user disagree",
                  "AccessDenied":
                      "credentials accepted, permission refused — the "
                      "ay-app-readwrite policy is missing or not attached",
              }

              def probe(name, check, what, target):
                  """Poll `check` until it returns without raising.

                  `check` is a callable rather than a URL because the two
                  dependencies are not probed the same way: ArangoDB answers
                  HTTP, MinIO speaks S3 and is verified with the very client
                  the application uses."""
                  log(f"{name}: waiting for {what}")
                  log(f"{name}: probing {target}")
                  started = time.monotonic()
                  attempt = 0
                  while True:
                      attempt += 1
                      status = None
                      try:
                          check()
                          log(f"{name}: READY after "
                              f"{time.monotonic() - started:.0f}s "
                              f"({attempt} attempt(s))")
                          return
                      except urllib.error.HTTPError as exc:
                          # A response, not a transport failure — the body
                          # usually names the real problem, so keep it.
                          status = exc.code
                          body = ""
                          try:
                              body = exc.read().decode("utf-8", "replace")[:300]
                          except Exception:
                              pass
                          detail = f"HTTP {exc.code} {exc.reason}" + (
                              f" — {body}" if body.strip() else
                              " — (empty body; that is itself a finding)"
                          )
                      except Exception as exc:
                          # S3Error carries `.code` ("AccessDenied",
                          # "InvalidAccessKeyId", …) — the most useful string
                          # there is, so surface it rather than the repr.
                          code = getattr(exc, "code", None)
                          status = code if isinstance(code, int) else None
                          detail = f"{type(exc).__name__}: {exc}"
                          if isinstance(code, str):
                              detail = f"{code}: {exc}"
                              hint_s = S3_HINTS.get(code)
                              if hint_s and attempt in (1, 10):
                                  log(f"{name}: hint — {hint_s}")

                      hint = HINTS.get(status)
                      elapsed = time.monotonic() - started
                      if time.monotonic() > deadline:
                          log(f"{name}: GIVING UP after {elapsed:.0f}s / "
                              f"{attempt} attempts")
                          log(f"{name}: last response — {detail}")
                          if hint:
                              log(f"{name}: likely cause — {hint}")
                          raise SystemExit(
                              f"[wait-for-deps] {name} never became ready. "
                              f"Raise WAIT_FOR_DEPS_TIMEOUT (currently "
                              f"{timeout:.0f}s) only if the dependency is "
                              f"genuinely just slow."
                          )
                      # Every attempt for the first 30s (the common case is a
                      # few seconds), then every 10th — enough to see movement
                      # without burying the cause under hundreds of lines.
                      if elapsed < 30 or attempt % 10 == 0:
                          log(f"{name}: not ready yet ({elapsed:.0f}s, "
                              f"attempt {attempt}) — {detail}")
                          if hint and attempt in (1, 10):
                              log(f"{name}: hint — {hint}")
                      time.sleep(3)

              # ArangoDB: authenticated read of the application database. Proves
              # arangod serves, the DB exists (arangodb-init ran) and the app
              # user can reach it — the exact precondition each lifespan needs.
              arango = required("ARANGO_URL").rstrip("/")
              database = os.environ.get("ARANGO_DB", "platform")
              username = required("ARANGO_USERNAME")
              token = base64.b64encode(
                  f"{username}:{required('ARANGO_PASSWORD')}".encode()
              ).decode()
              log(f"budget: {timeout:.0f}s total (WAIT_FOR_DEPS_TIMEOUT)")
              arango_url = f"{arango}/_db/{database}/_api/collection"
              arango_req = urllib.request.Request(
                  arango_url, headers={"Authorization": f"Basic {token}"},
              )

              def arango_check():
                  with urllib.request.urlopen(arango_req, timeout=5) as resp:
                      if resp.status != 200:
                          raise RuntimeError(f"HTTP {resp.status}")

              probe(
                  "arangodb",
                  arango_check,
                  f"database {database!r} readable as user {username!r} "
                  f"(created by the arangodb-init Job)",
                  arango_url,
              )

              # MinIO: AUTHENTICATED, with the application's own credentials
              # and the very client the components use (`minio` is a base
              # dependency of this image). An unauthenticated liveness call
              # would prove the server is up while saying nothing about the
              # credentials minio-init creates — so the container would pass
              # and the component would then fail in its own startup on
              # ensure_bucket(), which is the exact failure this initContainer
              # exists to remove.
              #
              # `bucket_exists` and NOT `list_buckets`: the ay-app-readwrite
              # policy grants `s3:*` on NAMED buckets, so ListAllMyBuckets
              # (which targets `arn:aws:s3:::*`) is denied even when the
              # credentials are perfectly correct. A list-based probe would
              # wait forever on a healthy platform.
              #
              # The bucket need not exist — the components create it. What is
              # being established is that the call is ACCEPTED.
              secure = os.environ.get("MINIO_SECURE", "false").strip().lower() == "true"
              endpoint = required("MINIO_ENDPOINT")
              bucket = os.environ.get("MINIO_BUCKET", "orchestrator")
              access_key = required("MINIO_ACCESS_KEY")

              def minio_check():
                  from minio import Minio
                  Minio(
                      endpoint,
                      access_key=access_key,
                      secret_key=required("MINIO_SECRET_KEY"),
                      secure=secure,
                  ).bucket_exists(bucket)

              probe(
                  "minio",
                  minio_check,
                  f"object storage reachable AND usable as {access_key!r} "
                  f"(credentials created by the minio-init Job)",
                  f"{'https' if secure else 'http'}://{endpoint} "
                  f"[HeadBucket {bucket}]",
              )

              log("ALL DEPENDENCIES READY — starting the component")
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
