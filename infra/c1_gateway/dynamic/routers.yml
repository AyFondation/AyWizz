# =============================================================================
# File: routers.yml
# Version: 15
# Path: infra/c1_gateway/dynamic/routers.yml
# Description: Traefik HTTP router definitions.
#
#              v15 (2026-10-05) closes an 83-endpoint routing hole found by
#              auditing the route catalogue against these rules. Adds
#              `c5-project-surfaces` (ten C5 project prefixes that were
#              being delivered to C2 → 404), `c5-process-tenant`
#              (`/api/v1/process`, which had no router at all → ui-catchall
#              → 502) and `c4-source` (6 endpoints, same 404 as the C5
#              ones). Essentially the whole 310-SPEC traceability capability
#              was unreachable through the gateway while every backend test
#              tier stayed green. `tests/coherence/
#              test_gateway_route_coverage.py` now fails the build on any
#              catalogued route that is unrouted, misrouted, or missing its
#              auth middleware.
#
#              v14 adds `c6-validation-project`
#              (`^/api/v1/projects/[^/]+/validation(/.*)?$`, priority 100) —
#              the C6 run-trigger moved into the project-scoped URI shape
#              because forward-auth-c2 can only append a project role when
#              the id is IN THE URI. In its old body-only form the endpoint
#              returned 403 to every caller. v11 adds `c8-admin-storage`
#              (`/admin/v1/storage`, priority 100) — the storage metering +
#              snapshot API that was missing (fell through to c2 → 404).
#              v10 adds `ui-admin-embedding`
#              (priority 60) so the UI governance PAGE paths `/admin/embedding-*`
#              reach the Next.js UI instead of C2 — the exact same fix v9 made
#              for `/admin/llm-*`, which had been forgotten for the (newer)
#              embedding registry pages (they returned "Not authenticated").
#              v9 adds `ui-admin-llm`
#              (priority 60) so the UI governance PAGE paths `/admin/llm-*`
#              reach the Next.js UI instead of C2 (they collided with the
#              c2-admin `/admin` prefix). The API prefix `/admin/v1/llm`
#              is unaffected (distinct string, still c8-admin-registry@100).
#              v8 adds the C8 admin LLM
#              governance surfaces (`/admin/v1/llm` priority 100 to win over
#              c2-admin ; `/api/v1/llm` priority 50), both forward-auth gated.
#              v3 adds the UI catch-all
#              (priority 1) so the Next.js standalone server receives
#              everything not claimed by an explicit backend route
#              (`/`, `/login`, `/dashboard`, `/_next/*`, etc.).
#              v2 aligns with real router paths and adds C7 / C9 public surfaces.
#
#   Route table (matches actual FastAPI routers as of session of 2026-04-23):
#     /auth/login     POST → C2 [rate-limit-auth]                          public
#     /auth/token     POST → C2 [rate-limit-auth]                          public
#     /auth/*              → C2  []                                        public
#     /ux/*                → C2  []                                        public
#     /api/v1/conversations/*          → C3 [forward-auth-c2, secure-hdrs]
#     /api/v1/orchestrator/*           → C4 [forward-auth-c2, secure-hdrs]
#     /api/v1/projects/*/requirements/* → C5 [forward-auth-c2, secure-hdrs]
#     /api/v1/validation/*             → C6 [forward-auth-c2, secure-hdrs]
#     /api/v1/projects/*/validation/*  → C6 [forward-auth-c2, secure-hdrs]
#     /api/v1/memory/*                 → C7 [forward-auth-c2, secure-hdrs]
#     /api/v1/mcp, /api/v1/mcp/*       → C9 [forward-auth-c2, secure-hdrs]
#     /uploads/*                       → C12 [forward-auth-c2, secure-hdrs]
#     <everything else>                → UI (priority 1)                   public
#
# @relation R-100-039 R-100-042 R-100-015 A-C1-1
# =============================================================================

http:
  routers:

    # -------------------------------------------------------------------------
    # C2 — Auth Service (public endpoints, rate-limited login/token)
    # -------------------------------------------------------------------------

    c2-auth-login:
      rule: "Path(`/auth/login`) && Method(`POST`)"
      service: c2
      entryPoints:
        - web
      middlewares:
        - rate-limit-auth
      priority: 100

    c2-auth-token:
      rule: "Path(`/auth/token`) && Method(`POST`)"
      service: c2
      entryPoints:
        - web
      middlewares:
        - rate-limit-auth
      priority: 100

    c2-auth:
      rule: "PathPrefix(`/auth`)"
      service: c2
      entryPoints:
        - web
      priority: 10

    # UX bootstrap config — public, no forward-auth.
    c2-ux-config:
      rule: "PathPrefix(`/ux`)"
      service: c2
      entryPoints:
        - web
      priority: 10

    # -------------------------------------------------------------------------
    # C3 — Conversation Service
    # -------------------------------------------------------------------------

    c3-conversations:
      rule: "PathPrefix(`/api/v1/conversations`)"
      service: c3
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # -------------------------------------------------------------------------
    # C4 — Orchestrator
    # -------------------------------------------------------------------------

    c4-orchestrator:
      rule: "PathPrefix(`/api/v1/orchestrator`)"
      service: c4
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # C4 — Project artifacts (transparent MinIO surface). Pinned with
    # priority 100 so it WINS over `c2-projects` (also under
    # `/api/v1/projects/*`, priority 50) for the artifacts subpath.
    # R-200-131. Per-tenant member ; platform_manager rejected in-app.
    c4-artifacts:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/artifacts(/.*)?$`)"
      service: c4
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # C4 — Project versioning proxy (R-200-147). Pinned with priority
    # 100 same as the artifacts surface for the same precedence
    # reason against c2-projects.
    c4-git:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/git(/.*)?$`)"
      service: c4
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # C4 — Chat-direct DocGen document CRUD (D-015 / R-200-153..156).
    # Same precedence (100) as c4-artifacts so it wins over the
    # generic c2-projects route. Regexp matches
    # `/api/v1/projects/<pid>/documents` and any sub-path.
    c4-documents:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/documents(/.*)?$`)"
      service: c4
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # C4 — Project source browser (tree / mkdir / rename / move / file meta
    # + delete). Same precedence (100) and the same reason as c4-artifacts:
    # without it these 6 endpoints matched `c2-projects` at priority 50 and
    # were delivered to C2, which 404s them.
    c4-source:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/source(/.*)?$`)"
      service: c4
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # C4 — Admin seed endpoint (dev-only). Different path prefix
    # `/api/v1/admin/projects/*` so it doesn't collide with
    # c4-artifacts above. Gated to admin/tenant_admin in-app.
    c4-artifacts-admin:
      rule: "PathPrefix(`/api/v1/admin/projects`)"
      service: c4
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # -------------------------------------------------------------------------
    # C2 — Admin (tenants lifecycle, platform_manager only)
    # -------------------------------------------------------------------------

    c2-admin:
      rule: "PathPrefix(`/admin`)"
      service: c2
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # UI governance pages live at `/admin/llm-registry` + `/admin/llm-catalogue`
    # (Next.js routes). They collide with the C2 admin PathPrefix(`/admin`)
    # above, so this higher-priority (60 > 50) router sends the `/admin/llm-*`
    # PAGE paths to the UI WITHOUT forward-auth (the browser fetches the page;
    # the UI's own apiClient carries the JWT on the API calls). It does NOT
    # match the API prefix `/admin/v1/llm` (distinct string), which keeps
    # winning via c8-admin-registry (priority 100).
    ui-admin-llm:
      rule: "PathPrefix(`/admin/llm`)"
      service: ui
      entryPoints:
        - web
      priority: 60

    # UI governance pages for the EMBEDDING registry live at
    # `/admin/embedding-registry` + `/admin/embedding-providers` +
    # `/admin/embedding-catalogue` (Next.js routes). Same collision as
    # `/admin/llm-*` with the C2 `/admin` prefix — this priority-60 router
    # sends the PAGE document to the UI. NO forward-auth (browser page nav).
    # The embedding ADMIN API stays on `/admin/v1/llm/embedding-*` (priority
    # 100, distinct string) so it is unaffected.
    ui-admin-embedding:
      rule: "PathPrefix(`/admin/embedding`)"
      service: ui
      entryPoints:
        - web
      priority: 60

    # -------------------------------------------------------------------------
    # C2 — Projects (lifecycle + membership grants)
    # -------------------------------------------------------------------------

    c2-projects:
      rule: "PathPrefix(`/api/v1/projects`)"
      service: c2
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # -------------------------------------------------------------------------
    # C2 — Self-service per-user preferences (trigram, LLM user prompt,
    # bubble colour). Any authenticated tenant member ; gated server-side.
    # -------------------------------------------------------------------------

    c2-preferences:
      rule: "PathPrefix(`/api/v1/users/me/preferences`)"
      service: c2
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # -------------------------------------------------------------------------
    # C5 — Requirements Service
    # (routes ONLY under /api/v1/projects/<pid>/requirements/*).
    # PathRegexp + priority 100 wins over c2-projects (priority 50)
    # for the `/requirements/...` subpath, leaving C2 to handle bare
    # /api/v1/projects, /api/v1/projects/<pid>, and members endpoints.
    # -------------------------------------------------------------------------

    c5-requirements:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/requirements(/.*)?$`)"
      service: c5
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # -------------------------------------------------------------------------
    # C5 — the REST of the project-scoped traceability surface (310-SPEC).
    #
    # WHY THIS EXISTS. Only `/requirements` was ever routed. Every other C5
    # project surface — 67 endpoints across ten prefixes — matched the
    # generic `c2-projects` (`PathPrefix(/api/v1/projects)`, priority 50)
    # and was delivered to C2, which does not implement them: the gateway
    # answered 404 for the whole capability. It was built, unit/contract/
    # integration-tested green, and dead in the deployed product, because
    # nothing in the suite checked that a catalogued route is routable to
    # its OWN component. `tests/coherence/test_gateway_route_coverage.py`
    # now refuses that.
    #
    # Alternation rather than ten routers: the list is the contract, and
    # keeping it in one place is what makes the next addition noticeable.
    # A new C5 project prefix MUST be added here.
    # -------------------------------------------------------------------------
    c5-project-surfaces:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/(absorb|baseline-readiness|baselines|changes|containers|coverage|impact|intake|plans|process)(/.*)?$`)"
      service: c5
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # C5 — tenant-level process surface (cycles + workflows as data, D-024).
    # No `{project_id}` segment, so it collided with nothing and simply had
    # no router at all: it fell through to `ui-catchall` and answered 502
    # (or the UI's 404). Priority 50 is enough — `/api/v1/process` is a
    # distinct string from every other prefix.
    c5-process-tenant:
      rule: "PathPrefix(`/api/v1/process`)"
      service: c5
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # C16 Backup/Restore — the `/backups` subpath, priority 100 (beats the
    # generic /api/v1/projects → c2 at 50). Forward-auth so C2 resolves the
    # caller's role ON {project_id} (R-900-011 / D-022).
    c16-backup:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/backups(/.*)?$`)"
      service: c16-backup
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    c16-backup-tenant:
      rule: "PathRegexp(`^/api/v1/tenants/[^/]+/backups(/.*)?$`)"
      service: c16-backup
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # -------------------------------------------------------------------------
    # C6 — Validation Pipeline Registry
    # -------------------------------------------------------------------------

    c6-validation:
      rule: "PathPrefix(`/api/v1/validation`)"
      service: c6
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # C6 — run trigger, project-scoped in the URI. Priority 100 beats the
    # generic `/api/v1/projects` → c2 (50), exactly like c4-artifacts,
    # c4-git, c4-documents, c5-requirements and c16-backup.
    #
    # The id MUST be in the URI: forward-auth-c2 appends the caller's
    # project-scoped role to `X-User-Roles` only when the forwarded URI
    # matches `…/projects/{pid}/…`. While the id travelled in the request
    # BODY (`/api/v1/validation/runs`), C2 could not see it, no project role
    # was ever appended, and C6's gate — which strips content-blind global
    # roles per E-100-002 v7 — refused every caller with 403. This router is
    # what makes the endpoint reachable at all; it also brings it under C2's
    # project lifecycle freeze, which the old shape escaped.
    c6-validation-project:
      rule: "PathRegexp(`^/api/v1/projects/[^/]+/validation(/.*)?$`)"
      service: c6
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # -------------------------------------------------------------------------
    # C7 — Memory Service
    # -------------------------------------------------------------------------

    c7-memory:
      rule: "PathPrefix(`/api/v1/memory`)"
      service: c7
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # -------------------------------------------------------------------------
    # C8 admin — platform LLM registry + tenant catalogue + quality resolver
    # (LLM-governance HMI). The registry sub-path `/admin/v1/llm` MUST win
    # over `c2-admin` (`PathPrefix(/admin)`, priority 50) → priority 100.
    # The catalogue/resolve sub-path `/api/v1/llm` has no collision (distinct
    # from `/api/v1/projects` etc.) → priority 50. Both forward-auth gated ;
    # per-role authorization is enforced in-app (platform_manager for registry,
    # admin/tenant_admin for catalogue).
    # -------------------------------------------------------------------------

    c8-admin-registry:
      rule: "PathPrefix(`/admin/v1/llm`)"
      service: c8-admin
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    c8-admin-catalog:
      rule: "PathPrefix(`/api/v1/llm`)"
      service: c8-admin
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # Global LLM quota policy (Lot 3). Admin surface `/admin/v1/quota` MUST win
    # over c2-admin (`PathPrefix(/admin)`, priority 50) → priority 100. The
    # user-facing self-status `/api/v1/quota` has no collision (distinct string).
    c8-admin-quota:
      rule: "PathPrefix(`/admin/v1/quota`)"
      service: c8-admin
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    c8-admin-quota-self:
      rule: "PathPrefix(`/api/v1/quota`)"
      service: c8-admin
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # C8 admin storage metering (E-100-002 v7): per-project/tenant disk usage +
    # the snapshot trigger. Same c8-admin backend; priority 100 beats
    # c2-admin (`/admin`). Without it, /admin/v1/storage/* → c2 → 404.
    c8-admin-storage:
      rule: "PathPrefix(`/admin/v1/storage`)"
      service: c8-admin
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 100

    # -------------------------------------------------------------------------
    # C9 — MCP Server (public MCP surface for external LLM agents)
    # -------------------------------------------------------------------------

    c9-mcp:
      rule: "PathPrefix(`/api/v1/mcp`)"
      service: c9
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # -------------------------------------------------------------------------
    # C12 — n8n Ingestion Workflow (upload reception)
    # -------------------------------------------------------------------------

    c12-uploads:
      rule: "PathPrefix(`/uploads`)"
      service: c12
      entryPoints:
        - web
      middlewares:
        - forward-auth-c2
        - secure-headers
      priority: 50

    # -------------------------------------------------------------------------
    # UI catch-all (priority 1). Routes EVERYTHING not claimed above to
    # the Next.js standalone server. Priority 1 = lowest, so any backend
    # route wins.
    #
    # CONSEQUENCE, stated correctly: `PathPrefix(`/`)` matches EVERY path,
    # so there is no such thing as an unrouted path on this gateway. In
    # `e2e_stack.sh up` (without the dev override) the `ui` service does not
    # exist, so ANY path not claimed by a backend router above answers 502 —
    # not only `/`. An earlier version of this comment said "only if `/` is
    # hit", which misread this very rule and sent
    # `tests/system/test_tcp_layer.py` hunting for a Traefik 404 that can
    # never occur. If you want a real 404, ask a backend prefix for a path
    # it does not serve.
    # -------------------------------------------------------------------------
    ui-catchall:
      rule: "PathPrefix(`/`)"
      service: ui
      entryPoints:
        - web
      priority: 1
