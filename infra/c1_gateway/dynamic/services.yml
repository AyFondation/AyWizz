# =============================================================================
# File: services.yml
# Version: 5
# Path: infra/c1_gateway/dynamic/services.yml
# Description: Traefik backend service definitions — COMPOSE binding.
#              This file is the environment-specific half of the dynamic
#              config: `routers.yml` and `middlewares.yml` are SHARED with
#              Kubernetes (mounted there from a generated ConfigMap), while
#              the backend URLs live here for compose and in
#              `../dynamic-k8s/services.yml` for K8s. The two environments
#              genuinely do not host the same set of backends, so binding is
#              the only part that legitimately differs.
#              v5: added the missing `c16-backup` definition (see below).
#              v4: added `c8-admin` (LLM governance HMI surface).
#              Service names match Docker Compose service names.
#              v3: added `ui` (Next.js standalone, port 3000). Only
#              instantiated by the dev override (`docker-compose.dev.
#              override.yml`) ; for plain `up`/CI runs the upstream is
#              unreachable but no route hits it (catch-all in
#              routers.yml is the only consumer).
#              v2: added c7 (memory) and c9 (mcp) — both are now reachable via
#              Traefik. c8 stays internal (LLM proxy access from C4 only).
# =============================================================================

http:
  services:

    c2:
      loadBalancer:
        servers:
          - url: "http://c2:8000"

    c3:
      loadBalancer:
        servers:
          - url: "http://c3:8000"

    c4:
      loadBalancer:
        servers:
          - url: "http://c4:8000"

    c5:
      loadBalancer:
        servers:
          - url: "http://c5:8000"

    c6:
      loadBalancer:
        servers:
          - url: "http://c6:8000"

    c7:
      loadBalancer:
        servers:
          - url: "http://c7:8000"

    c9:
      loadBalancer:
        servers:
          - url: "http://c9:8000"

    # C8 admin — platform LLM registry + tenant catalogue + quality resolver
    # (LLM-governance HMI). User-facing app of the C8 domain ; distinct from
    # the internal LLM proxy (`c8`, not Traefik-routed) and cost receiver.
    c8-admin:
      loadBalancer:
        servers:
          - url: "http://c8-admin:8000"

    c12:
      loadBalancer:
        servers:
          - url: "http://c12:5678"

    # C16 backup. `routers.yml` declares two routers against this service
    # (`/api/v1/projects/*/backups`, `/api/v1/tenants/*/backups`) but the
    # definition was missing here — Traefik does not publish a router whose
    # service is unknown, so BOTH backup routes were silently absent from the
    # compose stack. C16 has no compose service yet (K8s only), so the URL
    # below does not resolve under `up` ; the routes now fail visibly (502)
    # instead of vanishing, and the binding is already correct for the day
    # C16 joins the compose stack.
    c16-backup:
      loadBalancer:
        servers:
          - url: "http://c16-backup:8000"

    # Next.js UI — instantiated by docker-compose.dev.override.yml
    # (manual-test stack). Unreachable in plain `up` / CI runs ; the
    # catch-all router that consumes this service has priority 1 so
    # only requests not matched by any backend route reach here.
    ui:
      loadBalancer:
        servers:
          - url: "http://ui:3000"
