# Version: 4
# Path: .github/workflows/ci-build-images.yml
#
# CI - build the platform images and push them to GHCR. Two images :
#   - aywizz-api : Python tier (infra/docker/Dockerfile.api). Single
#     image, N containers selected at runtime via COMPONENT_MODULE
#     (R-100-114 v2).
#   - aywizz-ui  : Next.js 16 frontend (infra/docker/Dockerfile.ui).
#     Single image, runtime config via /runtime-config.json mounted
#     from a K8s ConfigMap.
#
# Triggered ONLY when ci-tests succeeds on main, so we never publish
# :latest from a broken commit.
#
# v4 (2026-05-29) : bump actions/checkout to v5 (Node 24) to clear the
# Node 20 runtime deprecation warning. The docker/* actions are
# third-party and keep their own runtime (out of scope).
#
# v3 (2026-04-29) : adds the `build-ui` job for the Next.js frontend
# now that the scaffold landed (`ay_platform_ui/` v3 + Dockerfile.ui).
# Same metadata-action / build-push-action pattern as build-api.
#
# v2 (2026-04-28): added explicit OCI labels (description / vendor /
# licenses) so GHCR / Docker Hub package pages are self-describing.

name: ci-build-images

on:
  workflow_run:
    workflows: [ci-tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-build-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-api:
    name: build & push api (GHCR)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Checkout (sha that triggered ci-tests)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Lowercase repository owner
        # GHCR namespaces are case-sensitive and must be lowercase.
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/aywizz-api
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short,prefix=sha-
          # Explicitly populate the OCI label fields that drive the
          # GHCR package page. metadata-action would auto-fill them
          # from the GitHub repo description (empty in this repo) —
          # we override so the page is informative regardless.
          labels: |
            org.opencontainers.image.title=AyWizz API
            org.opencontainers.image.description=Shared FastAPI image for the AyWizz platform Python tier. Hosts every backbone component (C2 Auth, C3 Conversation, C4 Orchestrator, C5 Requirements, C6 Validation, C7 Memory, C9 MCP). The active component is selected at runtime via the COMPONENT_MODULE env variable — one image, N containers.
            org.opencontainers.image.vendor=AyWizz
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/requirements/050-ARCHITECTURE-OVERVIEW.md

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
          provenance: false

  build-ui:
    name: build & push ui (GHCR)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Checkout (sha that triggered ci-tests)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute UI image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/aywizz-ui
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=AyWizz UI
            org.opencontainers.image.description=Next.js 16 frontend for the AyWizz platform. Boots from /runtime-config.json (mountable as a K8s ConfigMap) and GET /ux/config (served by C2) so the API URL, brand and feature flags can change WITHOUT rebuilding the image — single image, N environments.
            org.opencontainers.image.vendor=AyWizz
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/requirements/050-ARCHITECTURE-OVERVIEW.md

      - name: Build and push ui image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.ui
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,mode=max,scope=ui
          provenance: false

  # Added 2026-09-14 after an AKS deployment failed to pull this image.
  # `VERSIONING.md` §10 had listed aywizz-c13-extractor among the published
  # images since it was written, but no job ever built it: the name
  # `ghcr.io/…/aywizz-c13-extractor` was only ever a NAMING CONVENTION for an
  # image built locally by `k8s_build_images.sh --c13`, which docker-desktop
  # serves from its shared store under `imagePullPolicy: IfNotPresent`. That
  # works on a local cluster and cannot work on a managed one — AKS has no
  # such store, so the pull went to GHCR and found nothing.
  build-c13:
    name: build & push c13-extractor (GHCR)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 30
    steps:
      - name: Checkout (sha that triggered ci-tests)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute c13 image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/aywizz-c13-extractor
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=AyWizz C13 Extractor
            org.opencontainers.image.description=Document extraction + enrichment service (D-020, AyExtractor vendored). Internal-only, no gateway route (R-100-125 v2); consumed by C12 ingestion workflows and opted into per overlay.
            org.opencontainers.image.vendor=AyWizz
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/requirements/050-ARCHITECTURE-OVERVIEW.md

      - name: Build and push c13 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/c13_extractor/docker/Dockerfile
          # The image stamps the source revision it vendored (D-020 §3); the
          # local builder passes the same arg.
          build-args: |
            MONOREPO_GIT_SHA=${{ github.event.workflow_run.head_sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=c13
          cache-to: type=gha,mode=max,scope=c13
          provenance: false

  # Added 2026-09-14 alongside build-c13, for the same reason found the same
  # way: `infra/k8s/base/c4_openhands` rewrites the C4 image to
  # `ghcr.io/…/aywizz-c15-runner`, so that opt-in layer simply CANNOT run on a
  # cluster without a local image store until this image is published. The gap
  # was invisible on docker-desktop, where `k8s_build_images.sh --c15` fills the
  # shared store and no pull ever happens.
  #
  # It is the api image PLUS the `openhands` extra (libtmux, tree-sitter,
  # browser-use, litellm) — by far the heaviest of the four, and the reason the
  # shared `ay-api` image deliberately does not carry that tree (R-100-114).
  # Its own build cache scope keeps it from evicting the others'.
  build-c15:
    name: build & push c15-runner (GHCR)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    timeout-minutes: 45
    steps:
      - name: Checkout (sha that triggered ci-tests)
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Lowercase repository owner
        run: echo "OWNER_LC=${OWNER,,}" >> "$GITHUB_ENV"
        env:
          OWNER: ${{ github.repository_owner }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute c15 image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.OWNER_LC }}/aywizz-c15-runner
          tags: |
            type=raw,value=latest
            type=raw,value=main
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=AyWizz C15 Runner
            org.opencontainers.image.description=The ay-api image plus ay_platform_core[openhands] (openhands-sdk + openhands-tools) and its runtime tools (tmux, git). Runs the C4 Orchestrator with C4_GENERATE_ENGINE=openhands; the shared api image stays free of this dependency tree.
            org.opencontainers.image.vendor=AyWizz
            org.opencontainers.image.licenses=Proprietary
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/requirements/050-ARCHITECTURE-OVERVIEW.md

      - name: Build and push c15 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/Dockerfile.c15-runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=c15
          cache-to: type=gha,mode=max,scope=c15
          provenance: false
