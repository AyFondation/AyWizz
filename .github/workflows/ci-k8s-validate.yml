# Version: 4
# Path: .github/workflows/ci-k8s-validate.yml
#
# CI - validate the K8s manifests under `infra/k8s/`. Four levels:
#   L1 — kubectl kustomize build + kubeval schema validation (offline,
#        fast, runs on every PR touching infra/k8s/).
#   L2 — kind cluster bring-up + apply + wait for Deployments /
#        StatefulSets / Jobs.
#   L3 — endpoint smoke via Traefik port-forward (curl /auth/config 200,
#        curl /api/v1/memory/health 401 to verify forward-auth fires).
#   L4 — pytest -m system_k8s (`run_k8s_system_tests.sh`): full kind
#        bring-up + image build + apply + 4 Python smoke tests
#        (open route 200, protected 401, login + token round-trip,
#        token validation across components). v2.
#
# v3 (2026-05-29): bump GitHub-maintained actions to their Node 24
# majors (checkout v5, setup-python v6) — clears the Node 20 runtime
# deprecation warning. helm/kind-action (third-party) keeps its own
# runtime.

name: ci-k8s-validate

on:
  push:
    branches: [main]
    paths:
      - "infra/k8s/**"
      - "infra/docker/**"
      - "infra/scripts/k8s_*.sh"
      - "ay_platform_core/scripts/run_k8s_system_tests.sh"
      - "ay_platform_core/tests/system/k8s/**"
      - ".github/workflows/ci-k8s-validate.yml"
      # L5 drives a BROWSER against the deployed UI, so the UI's own
      # sources and its system specs must trigger this workflow. Their
      # absence would have reproduced, exactly, the `.dockerignore` defect
      # recorded below: the job that would catch the regression does not
      # run, because the file that caused it is not under `infra/`.
      - "ay_platform_ui/**"
      - "ay_platform_core/scripts/run_ui_system_tests.sh"
      - "infra/k8s/overlays/ui-system-test/**"
      # `.dockerignore` decides what the api image CONTAINS. Its absence
      # from this filter is how `**/coverage` shipped: the pattern was
      # written for vitest's report directory, it also matched the Python
      # package `c5_requirements/coverage/`, and C5 was un-deployable with
      # `ModuleNotFoundError` from increment 3 of 310-SPEC onward. The
      # image built, 3953 tests stayed green, and this workflow — the only
      # thing that would have caught it — did not run, because a build
      # exclusion file is not under `infra/`.
      - ".dockerignore"
      # The SOURCE of the Traefik dynamic config. `infra/k8s/**` only
      # matches the GENERATED configmap, so an edit here that was not
      # regenerated would skip validation precisely when the two diverge
      # — which is the one case worth catching.
      - "infra/c1_gateway/**"
  pull_request:
    paths:
      - "infra/k8s/**"
      - "infra/docker/**"
      - "infra/scripts/k8s_*.sh"
      - "ay_platform_core/scripts/run_k8s_system_tests.sh"
      - "ay_platform_core/tests/system/k8s/**"
      - ".github/workflows/ci-k8s-validate.yml"
      # L5 drives a BROWSER against the deployed UI, so the UI's own
      # sources and its system specs must trigger this workflow. Their
      # absence would have reproduced, exactly, the `.dockerignore` defect
      # recorded below: the job that would catch the regression does not
      # run, because the file that caused it is not under `infra/`.
      - "ay_platform_ui/**"
      - "ay_platform_core/scripts/run_ui_system_tests.sh"
      - "infra/k8s/overlays/ui-system-test/**"
      # `.dockerignore` decides what the api image CONTAINS. Its absence
      # from this filter is how `**/coverage` shipped: the pattern was
      # written for vitest's report directory, it also matched the Python
      # package `c5_requirements/coverage/`, and C5 was un-deployable with
      # `ModuleNotFoundError` from increment 3 of 310-SPEC onward. The
      # image built, 3953 tests stayed green, and this workflow — the only
      # thing that would have caught it — did not run, because a build
      # exclusion file is not under `infra/`.
      - ".dockerignore"
      # The SOURCE of the Traefik dynamic config. `infra/k8s/**` only
      # matches the GENERATED configmap, so an edit here that was not
      # regenerated would skip validation precisely when the two diverge
      # — which is the one case worth catching.
      - "infra/c1_gateway/**"

permissions:
  contents: read

jobs:

  l1-static-lint:
    name: L1 — kustomize build + kubeval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Install kubeval
        run: |
          set -e
          curl -sSL -o kubeval.tar.gz \
            "https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz"
          tar xf kubeval.tar.gz
          sudo mv kubeval /usr/local/bin/
          kubeval --version

      - name: L1 validation
        run: bash infra/scripts/k8s_validate.sh

  l2-l3-kind-smoke:
    name: L2+L3 — kind cluster smoke
    runs-on: ubuntu-latest
    needs: l1-static-lint
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.24.0

      - name: L2+L3 smoke
        run: bash infra/scripts/k8s_kind_smoke.sh

  l4-system-tests:
    name: L4 — pytest -m system_k8s (live K8s smoke)
    runs-on: ubuntu-latest
    needs: l1-static-lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.24.0

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pytest stack (no full project install)
        run: |
          set -e
          python -m pip install --upgrade pip
          # Minimal deps to run the smoke tests; the suite uses only
          # httpx + pytest + pytest-asyncio. Full project install is
          # not needed (the tests hit the cluster, not in-process).
          python -m pip install \
            "pytest==8.4.*" \
            "pytest-asyncio==0.26.*" \
            "pytest-cov==7.1.*" \
            "httpx>=0.27"

      - name: Run L4 system tests
        run: bash ay_platform_core/scripts/run_k8s_system_tests.sh

  # ---------------------------------------------------------------------------
  # L5 — the UI system tier: a real browser against the real deployed edge.
  #
  # WHY IT IS A JOB AND NOT A STEP OF L4. It needs a DIFFERENT overlay
  # (`ui-system-test`, which enables the demo seed — without it every
  # project-scoped write answers 403) and a browser, and it must not make
  # L4's stack carry dev affordances. Separate jobs keep each tier's stack
  # honest about what it is.
  #
  # WHY IT IS HERE AT ALL. `ay_platform_ui/tests/system/` held five specs
  # that NOTHING executed — `npm run test:system` and
  # `playwright.system.config.ts` both existed, the specs listed correctly,
  # and no script or workflow called them. It is the only tier that drives a
  # browser through the deployed platform, which is the class
  # `source-upload.spec.ts` exists to guard: a mocked test encodes the same
  # wrong contract as the code it tests, so it cannot catch front/back drift.
  # ---------------------------------------------------------------------------
  l5-ui-system-tests:
    name: L5 — Playwright system tier (real browser, live K8s)
    runs-on: ubuntu-latest
    needs: l1-static-lint
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          version: v0.24.0

      - name: Set up Node.js 25
        uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: "npm"
          cache-dependency-path: ay_platform_ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci
        working-directory: ay_platform_ui

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ay_platform_ui/package-lock.json') }}

      # `--with-deps` HERE and not in the wrapper: the runner is root and
      # needs the OS libraries, while a devcontainer user cannot apt-get.
      # The wrapper then runs with `--skip-browser-install`.
      - name: Install Playwright browser + OS deps
        run: npx playwright install --with-deps chromium
        working-directory: ay_platform_ui

      - name: Run L5 UI system tests
        run: bash ay_platform_core/scripts/run_k8s_system_tests.sh --ui --skip-browser-install

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-system-report-${{ github.run_id }}
          path: ay_platform_ui/playwright-report/
          retention-days: 14
